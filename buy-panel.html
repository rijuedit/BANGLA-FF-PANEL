<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUY Panel - BANGLA FF PANEL</title>
  
  <!-- Google Fonts & Boxicons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  
  <!-- Main CSS (for background and header) -->
  <link rel="stylesheet" href="style.css">

  <!-- =========================================
       INNER PAGE CSS (BUY Panel Custom Style)
       ========================================= -->
  <style>
    .inner-page-container {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 40px auto 80px;
      position: relative;
      z-index: 1;
    }

    .inner-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn, .share-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .back-btn:hover, .share-btn:hover {
      background: rgba(0, 242, 254, 0.1);
      border-color: #00f2fe;
      color: #fff;
    }

    .inner-content-card {
      background: rgba(13, 15, 26, 0.75);
      border: 1px solid rgba(0, 242, 254, 0.15);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.05);
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
    }

    .title-skip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0;
      flex-wrap: wrap;
      gap: 15px;
    }

    .panel-titles h2 {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      margin: 0 0 5px;
      letter-spacing: 1px;
    }

    .panel-titles p {
      font: 600 11px var(--mono);
      color: #94a3b8;
      margin: 0;
      letter-spacing: 1px;
    }

    .how-to-skip-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s;
    }

    .how-to-skip-btn:hover {
      background: rgba(16, 185, 129, 0.2);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    .password-section {
      border: 1px solid rgba(234, 179, 8, 0.3);
      background: rgba(234, 179, 8, 0.05);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }

    .pass-label {
      font: 700 10px var(--mono);
      color: #facc15;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pass-value-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .password-text {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid rgba(234, 179, 8, 0.5);
      color: #facc15;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }

    .copy-btn:hover {
      background: rgba(234, 179, 8, 0.2);
      color: #fff;
    }

    /* DOWNLOAD GRID */
    .download-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .download-box {
      position: relative;
      background: rgba(6, 7, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 22px 20px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .download-box:hover {
      border-color: #00f2fe;
      box-shadow: 0 5px 25px rgba(0, 242, 254, 0.18);
      transform: translateY(-3px);
    }

    .status-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font: 700 9px var(--mono);
      padding: 3px 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .status-badge .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .box-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #ef4444;
      margin-bottom: 16px;
    }

    .download-box h3 {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin: 0 0 16px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
      border: 1px solid #5865f2;
      color: #fff;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s;
    }

    .dl-btn:hover {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .download-grid { grid-template-columns: 1fr; }
      .inner-content-card { padding: 16px; }
      .title-skip-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Animated Background Lights -->
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>
  <div class="mouse-glow"></div>

  <!-- TOPBAR -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo"><img src="logo.png" alt="Logo"></span>
      <span class="brand-text">
        <strong>BANGLA FF PANEL</strong>
        <small>COMMUNITY • GAMING HUB</small>
      </span>
    </a>
    <nav class="top-actions">
      <a class="home-btn" href="index.html">Home</a>
      <a class="discord-btn" href="https://discord.gg/9VGgu48bY" target="_blank"><span class="discord-mark">◉</span> Discord</a>
    </nav>
  </header>

  <!-- INNER PAGE CONTENT -->
  <main class="inner-page-container">
    
    <!-- Top Action Row -->
    <div class="inner-header-actions">
      <a href="index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Back</a>
      <button class="share-btn"><i class='bx bx-share-alt'></i> Share</button>
    </div>

    <!-- Main Content Card -->
    <div class="inner-content-card">
      
      <!-- Video Section -->
      <div class="video-container">
        <iframe id="main-video" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Title & Skip Button Row -->
      <div class="title-skip-row">
        <div class="panel-titles">
          <h2>BUY PANEL</h2>
          <p>PREMIUM • FAST • RELIABLE</p>
        </div>
        <a href="HOW_TO_SKIP_LINK" target="_blank" class="how-to-skip-btn">
          <i class='bx bx-skip-next-circle'></i> HOW TO SKIP
        </a>
      </div>

      <!-- Password Section -->
      <div class="password-section">
        <div class="pass-label"><i class='bx bx-lock-alt'></i> RAR PASSWORD</div>
        <div class="pass-value-row">
          <span class="password-text" id="panel-password">1</span>
          <button class="copy-btn" onclick="copyPassword()"><i class='bx bx-copy'></i> Copy</button>
        </div>
      </div>

      <!-- Download Buttons Section -->
      <div class="download-grid">
        
        <!-- Button 1: BUY PANEL DOWNLOAD -->
        <div class="download-box">
          <span class="status-badge"><span class="dot"></span> LIVE</span>
          <div class="box-icon"><i class='bx bxs-flame'></i></div>
          <h3>BUY PANEL LATEST VERSION</h3>
          <a href="BUY_PANEL_DOWNLOAD_LINK" target="_blank" class="dl-btn"><i class='bx bx-shopping-bag'></i> Buy Now</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>

  <!-- Script for Copy Password -->
  <script>
    function copyPassword() {
      const passwordText = document.getElementById("panel-password").innerText;
      navigator.clipboard.writeText(passwordText).then(() => {
        const copyBtn = document.querySelector(".copy-btn");
        const originalHTML = copyBtn.innerHTML;
        
        copyBtn.innerHTML = "<i class='bx bx-check'></i> Copied!";
        copyBtn.style.color = "#34d399";
        copyBtn.style.borderColor = "#34d399";
        
        setTimeout(() => {
          copyBtn.innerHTML = originalHTML;
          copyBtn.style.color = "";
          copyBtn.style.borderColor = "";
        }, 2000);
      });
    }
  </script>
</body>
</html>
