<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUY Panel - BANGLA FF PANEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <style>
    .inner-page-container{width:calc(100% - 40px);max-width:900px;margin:40px auto 80px;position:relative;z-index:1}
    .inner-header-actions{display:flex;justify-content:space-between;margin-bottom:28px}
    .back-btn,.share-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
    .back-btn:hover,.share-btn:hover{border-color:#00f2fe;color:#fff}
    .page-title-section{text-align:center;margin-bottom:35px}
    .page-title-section h1{font-size:30px;font-weight:900;color:#fff;margin:0 0 8px;text-transform:uppercase}
    .page-title-section p{font:500 12px var(--mono);color:#94a3b8;margin:0;letter-spacing:1.5px}
    .panel-list{display:flex;flex-direction:column;gap:14px;margin-bottom:40px}
    .panel-list-item{display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(13,15,26,.75);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px 22px;transition:.3s;cursor:pointer;flex-wrap:wrap}
    .panel-list-item:hover{border-color:rgba(0,242,254,.35)}
    .panel-list-item.selected{border-color:#00f2fe;box-shadow:0 0 20px rgba(0,242,254,.25);background:rgba(0,242,254,.06)}
    .panel-info{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
    .panel-icon{width:46px;height:46px;border-radius:12px;background:rgba(0,242,254,.1);border:1px solid rgba(0,242,254,.25);display:grid;place-items:center;color:#00f2fe;font-size:22px;flex-shrink:0}
    .panel-text h3{margin:0 0 4px;font-size:15px;font-weight:800;color:#fff;text-transform:uppercase}
    .panel-text p{margin:0;font-size:12px;color:#94a3b8}
    .panel-right-group{display:flex;align-items:center;gap:14px;flex-shrink:0}
    .panel-price{font-size:16px;font-weight:900;color:#00f2fe;white-space:nowrap}
    .item-buy-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(0,242,254,.2),rgba(88,101,242,.3));border:1px solid #00f2fe;color:#fff;padding:8px 16px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;text-transform:uppercase;transition:.25s}
    .item-buy-btn:hover{background:#00f2fe;color:#000}
    .buy-now-section{text-align:center;padding:32px 24px;background:rgba(13,15,26,.7);border:1px solid rgba(0,242,254,.2);border-radius:16px}
    .buy-now-section h3{margin:0 0 8px;font-size:18px;font-weight:800;color:#fff}
    .buy-now-section p{margin:0 0 12px;font-size:13px;color:#94a3b8}
    .selected-hint{font-size:12px;color:#00f2fe;margin-bottom:16px;min-height:18px}
    .buy-now-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(0,242,254,.2),rgba(88,101,242,.25));border:1px solid #00f2fe;color:#fff;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:800;text-decoration:none;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
    .buy-now-btn:hover{transform:translateY(-3px);box-shadow:0 0 35px rgba(0,242,254,.45)}
  </style>
</head>
<body>
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>
  <div class="mouse-glow"></div>

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo"><img src="logo.png" alt="Logo" class="site-logo"></span>
      <span class="brand-text"><strong>BANGLA FF PANEL</strong><small>COMMUNITY • GAMING HUB</small></span>
    </a>
    <nav class="top-actions">
      <a class="home-btn" href="index.html">Home</a>
      <a class="discord-btn" href="https://discord.gg/9VGgu48bY" target="_blank"><span class="discord-mark">◉</span> Discord</a>
    </nav>
  </header>

  <main class="inner-page-container">
    <div class="inner-header-actions">
      <a href="index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Back</a>
      <button class="share-btn"><i class='bx bx-share-alt'></i> Share</button>
    </div>
    <div class="page-title-section">
      <h1>PC PANEL LIST</h1>
      <p>PC PREMIUM PANELS — সিলেক্ট করে BUY করুন</p>
    </div>
    <div class="panel-list" id="buy-panel-list"></div>
    <div class="buy-now-section">
      <h3>কিনতে চাইলে প্যাকেজ সিলেক্ট করে Buy Now চাপুন</h3>
      <p class="selected-hint" id="buy-selected-hint">কোনো প্যাকেজ সিলেক্ট করা হয়নি</p>
      <button type="button" class="buy-now-btn" id="buy-now-btn" onclick="buyNowClick('buy')">
        <i class='bx bxl-discord-alt'></i>
        <span id="buy-now-label">BUY NOW</span>
      </button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
