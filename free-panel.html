<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF PANEL - FREE PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #05020a; color: #ffffff; min-height: 100vh; padding-bottom: 40px; }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(10, 5, 18, 0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid #1a0b2e;
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-logo img { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #9d00ff; }
        .brand-text h1 { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; }
        .brand-text span { font-size: 10px; color: #ff0066; letter-spacing: 1.5px; font-weight: 600; display: block; }

        .nav-actions { display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.05); color: #ccc; text-decoration: none;
            padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1); display: inline-flex; align-items: center; gap: 6px;
        }
        .nav-btn.discord-btn { color: #5865F2; border-color: rgba(88, 101, 242, 0.4); }

        /* Container */
        .main-container { max-width: 850px; margin: 25px auto; padding: 0 20px; }

        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; background: #11071a;
            color: #ccc; text-decoration: none; padding: 8px 18px; border-radius: 6px;
            font-size: 13px; font-weight: 600; border: 1px solid #2a113d; margin-bottom: 20px;
        }

        /* Video Box */
        .video-box {
            position: relative; width: 100%; height: 420px; background: #0d0614;
            border: 1px solid #2a113d; border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center; margin-bottom: 25px;
        }
        .yt-card {
            width: 100%; height: 100%; background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative;
        }
        .play-btn-circle {
            width: 70px; height: 70px; background: rgba(255, 0, 102, 0.9);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 26px; z-index: 2; box-shadow: 0 0 25px rgba(255, 0, 102, 0.8);
        }

        /* TITLE & SKIP BUTTON ROW (এটিই আপনার মেইন ফিক্স) */
        .title-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; width: 100%;
        }
        .section-title { font-size: 24px; font-weight: 800; color: #fff; text-transform: uppercase; }

        .skip-btn {
            background: transparent; color: #00cc66; border: 1px solid #00cc66;
            padding: 6px 14px; border-radius: 5px; text-decoration: none;
            font-size: 12px; font-weight: 700; display: none; align-items: center; gap: 6px;
            transition: 0.3s; box-shadow: 0 0 10px rgba(0, 204, 102, 0.2);
        }
        .skip-btn:hover { background: #00cc66; color: #000; box-shadow: 0 0 15px rgba(0, 204, 102, 0.5); }

        .section-subtitle { color: #888; font-size: 13px; margin-bottom: 20px; display: block; }

        /* RAR Box */
        .rar-box {
            background: rgba(255, 153, 0, 0.05); border: 1px solid rgba(255, 153, 0, 0.2);
            border-radius: 8px; padding: 15px 20px; margin-bottom: 25px;
        }
        .rar-header { color: #ff9900; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        .rar-body { display: flex; justify-content: space-between; align-items: center; }
        .btn-copy {
            background: transparent; border: 1px solid #ff9900; color: #ff9900;
            padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }

        /* Items */
        .items-container { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: #11071a; border: 1px solid #2a113d; border-radius: 10px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-download {
            background: linear-gradient(135deg, #9d00ff 0%, #ff0066 100%);
            color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 6px;
            font-size: 13px; font-weight: 700;
        }
        .empty-state { text-align: center; padding: 40px; color: #555; border: 1px dashed #222; border-radius: 10px; }

        @media (max-width: 600px) {
            .video-box { height: 220px; }
            .title-row { flex-direction: row; }
            .section-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand-logo">
            <img src="https://i.ibb.co/L8xX0xT/logo.jpg" alt="Logo">
            <div class="brand-text"><h1>BANGLA FF PANEL</h1><span>PREMIUM CORP</span></div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            <a href="#" target="_blank" class="nav-btn discord-btn dynamic-discord"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <main class="main-container">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>

        <!-- Video Section -->
        <div class="video-box">
            <a href="#" id="ytCard" target="_blank" class="yt-card" style="display: none;">
                <div class="play-btn-circle"><i class="fas fa-play"></i></div>
            </a>
            <iframe id="videoIframe" style="width:100%; height:100%; border:none; display:none;"></iframe>
            <div id="videoPlaceholder" class="video-placeholder" style="color:#444; text-align:center;">
                <i class="fas fa-play-circle" style="font-size:50px;"></i><br><span>NO VIDEO AVAILABLE</span>
            </div>
        </div>

        <!-- Title Row & How to Skip -->
        <div class="title-row">
            <h2 class="section-title">FREE PANEL</h2>
            <a href="#" id="skipBtn" target="_blank" class="skip-btn">
                <i class="fas fa-question-circle"></i> HOW TO SKIP
            </a>
        </div>
        <span class="section-subtitle">NEW PC PANEL UPDATED OB55</span>

        <!-- RAR Password -->
        <div class="rar-box">
            <div class="rar-header"><i class="fas fa-lock"></i> RAR PASSWORD</div>
            <div class="rar-body">
                <span id="rarPasswordVal" style="font-weight:bold; font-size:18px;">1</span>
                <button class="btn-copy" onclick="copyPassword()"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>

        <!-- Items -->
        <div id="itemsContainer" class="items-container">
            <div class="empty-state">Loading...</div>
        </div>
    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getYoutubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Fetch Page Settings (Video, Skip, Password)
        db.ref('page_settings/free_panel').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            
            // Handle Video
            const ytCard = document.getElementById('ytCard');
            const iframe = document.getElementById('videoIframe');
            const placeholder = document.getElementById('videoPlaceholder');
            
            if (data.video_enabled && data.video_url) {
                const ytId = getYoutubeId(data.video_url);
                if (ytId) {
                    ytCard.style.display = 'flex';
                    ytCard.style.backgroundImage = `url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')`;
                    ytCard.href = data.video_url;
                    placeholder.style.display = 'none';
                } else if (data.video_url.includes('drive.google.com')) {
                    iframe.style.display = 'block';
                    iframe.src = data.video_url.replace('/view', '/preview');
                    placeholder.style.display = 'none';
                }
            }

            // Handle Password
            document.getElementById('rarPasswordVal').innerText = data.rar_password || '1';

            // Handle HOW TO SKIP Button
            const skipBtn = document.getElementById('skipBtn');
            const skipUrl = data.how_to_skip || '';
            const skipEnabled = data.skip_enabled !== false;

            if (skipEnabled && skipUrl.trim() !== '') {
                skipBtn.href = skipUrl;
                skipBtn.style.display = 'inline-flex'; // Link থাকলে শো করবে
            } else {
                skipBtn.style.display = 'none'; // না থাকলে হাইড থাকবে
            }
        });

        // Fetch Download Items
        db.ref('free_panels').on('value', (snapshot) => {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="empty-state">No Free Panel Available</div>';
                return;
            }
            snapshot.forEach((child) => {
                const item = child.val();
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        <div style="width:40px; height:40px; background:rgba(157,0,255,0.1); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#9d00ff;">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <div>
                            <div style="font-weight:700;">${item.title}</div>
                            <div style="font-size:11px; color:#666;">Latest Update</div>
                        </div>
                    </div>
                    <a href="${item.download}" target="_blank" class="btn-download">Download</a>
                `;
                container.appendChild(card);
            });
        });

        function copyPassword() {
            const txt = document.getElementById('rarPasswordVal').innerText;
            navigator.clipboard.writeText(txt);
            alert('Password Copied: ' + txt);
        }

        db.ref('global_settings/discord_link').on('value', s => {
            if(s.val()) document.querySelectorAll('.dynamic-discord').forEach(a => a.href = s.val());
        });
    </script>
</body>
</html>
