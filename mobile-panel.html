<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Panel - BANGLA FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05020a;
            --bg-card: #0c0514;
            --neon-purple: #9d00ff;
            --neon-pink: #ff0066;
            --neon-green: #00cc66;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --border-color: #2a113d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(12, 5, 20, 0.95);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0;
            z-index: 1000; backdrop-filter: blur(10px);
        }

        .nav-brand { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .nav-brand img { width: 45px; height: 45px; border-radius: 8px; border: 1px solid var(--neon-purple); object-fit: cover; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: #ffffff; letter-spacing: 1px; }
        .brand-subtitle { font-size: 0.8rem; color: var(--neon-pink); font-weight: 700; letter-spacing: 2px; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .btn-nav {
            background: #11071a; color: #ffffff; padding: 8px 20px; border-radius: 6px;
            text-decoration: none; font-weight: bold; display: flex; align-items: center;
            gap: 8px; border: 1px solid var(--border-color); transition: 0.3s; font-size: 0.95rem;
        }
        .btn-nav:hover { background: #1a0b2e; border-color: var(--neon-purple); }
        .btn-discord { background: rgba(88, 101, 242, 0.1); border-color: #5865F2; color: #5865F2; }
        .btn-discord:hover { background: #5865F2; color: #ffffff; border-color: #5865F2; }

        .main-container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px; background: #0c0514;
            color: #ffffff; padding: 8px 20px; border-radius: 8px; text-decoration: none;
            border: 1px solid var(--border-color); margin-bottom: 25px; font-weight: 600; transition: 0.3s;
        }
        .back-link:hover { border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(157, 0, 255, 0.2); }

        .video-box {
            width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 30px;
        }
        .yt-card { width: 100%; height: 100%; cursor: pointer; position: relative; }
        .yt-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .play-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; color: #ff0066; text-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
        }

        .section-title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #ffffff; margin-bottom: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 25px 20px; text-align: center; transition: 0.3s; cursor: pointer;
        }
        .product-card:hover { border-color: var(--neon-purple); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(157, 0, 255, 0.15); }
        .product-img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; }
        .product-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; color: #ffffff; font-family: 'Orbitron', sans-serif; }
        .price-tag { color: var(--neon-green); font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 10, 0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--neon-purple);
            width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #fff; }

        .package-selector { margin: 20px 0; max-height: 250px; overflow-y: auto; }
        .package-option {
            background: rgba(157, 0, 255, 0.05); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s;
        }
        .package-option.active { border-color: var(--neon-purple); background: rgba(157, 0, 255, 0.25); }

        .buy-now-btn {
            width: 100%; padding: 16px; background: var(--neon-purple); color: white; border: none;
            border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px;
            transition: 0.3s; font-family: 'Orbitron', sans-serif;
        }
        .buy-now-btn:hover { background: #b01aff; box-shadow: 0 0 15px rgba(157, 0, 255, 0.4); }
        #loading { text-align: center; color: var(--neon-purple); font-size: 1.5rem; padding: 40px; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="Logo">
            <div class="brand-text">
                <span class="brand-title">BANGLA FF PANEL</span>
                <span class="brand-subtitle">PREMIUM CORP</span>
            </div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> Home</a>
            <a href="https://discord.gg/ZBjSWaF7u" class="btn-nav btn-discord" target="_blank"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <div class="main-container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>

        <div class="video-box" id="videoBox" style="display:none;">
            <div id="ytCard" class="yt-card" style="display:none;">
                <img id="ytThumb" src="" alt="Thumbnail">
                <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
            </div>
            <iframe id="driveFrame" style="display:none; width:100%; height:100%; border:none;" allow="autoplay"></iframe>
        </div>

        <h2 class="section-title">PREMIUM MOBILE PANELS</h2>
        
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> Loading Panels...</div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalBody">
                <h2 id="modalProdName" style="color: #fff; font-family: 'Orbitron', sans-serif; margin-bottom:20px; text-align:center;"></h2>
                <div class="package-selector" id="packageList"></div>
                <label style="font-size: 0.9rem; color: var(--text-dim); display:block; margin-bottom:8px;">Discord Username or 18-Digit User ID:</label>
                <input type="text" id="discordUser" placeholder="e.g. riju_vai or 123456789012345678" style="width:100%; padding:14px; background:#0c0514; border:1px solid var(--border-color); color:white; border-radius:8px; margin-bottom:20px; outline:none; font-size:1rem;">
                <button class="buy-now-btn" onclick="processPurchase()">GET TICKET & PURCHASE</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedProduct = null;
        let selectedPackage = null;

        function getSafePrice(item) {
            if (!item) return 0;
            const keys = ['price', 'salePrice', 'newPrice', 'buyPrice', 'resellPrice', 'value'];
            for (let key of keys) {
                if (item[key] !== undefined && item[key] !== null && parseInt(item[key]) > 0) return parseInt(item[key]);
            }
            return 0;
        }

        async function loadContent() {
            db.ref('settings/video_mobile').once('value', snapshot => {
                const data = snapshot.val();
                if (data && data.url) {
                    const url = data.url;
                    document.getElementById('videoBox').style.display = 'block';
                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        let vid = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                        document.getElementById('ytThumb').src = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
                        document.getElementById('ytCard').style.display = 'block';
                        document.getElementById('ytCard').onclick = () => window.open(url, '_blank');
                    } else {
                        document.getElementById('driveFrame').src = url.replace('/view', '/preview');
                        document.getElementById('driveFrame').style.display = 'block';
                    }
                }
            });

            const grid = document.getElementById('productsGrid');

            function renderProducts(snapshot) {
                document.getElementById('loading').style.display = 'none';
                grid.innerHTML = '';
                let count = 0;

                snapshot.forEach(child => {
                    const p = child.val();
                    if(!p || typeof p !== 'object') return;
                    if (child.key === 'pc' || child.key === 'free') return;

                    p.id = child.key;
                    let minPrice = 0;
                    if (p.packages) {
                        const pkgArray = Object.values(p.packages);
                        if (pkgArray.length > 0) minPrice = getSafePrice(pkgArray[0]);
                    } else {
                        minPrice = getSafePrice(p);
                    }

                    count++;
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => openModal(p);
                    card.innerHTML = `
                        <img src="${p.image || p.img || 'logo.png'}" class="product-img" onerror="this.src='logo.png'">
                        <div class="product-name">${p.name || p.title || 'Mobile Panel'}</div>
                        <div class="price-tag">Starting ৳${minPrice}</div>
                        <div style="color: var(--text-dim); font-size: 0.9rem; background:#11071a; padding:8px; border-radius:6px;"><i class="fas fa-shopping-cart"></i> View Packages</div>
                    `;
                    grid.appendChild(card);
                });

                if(count === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-dim);">No Mobile products available right now.</p>';
                }
            }

            db.ref('products/mobile').on('value', snapshot => {
                if (snapshot.exists() && snapshot.hasChildren()) {
                    renderProducts(snapshot);
                } else {
                    db.ref('products').once('value', snap2 => {
                        if (snap2.exists() && snap2.hasChildren()) {
                            renderProducts(snap2);
                        } else {
                            document.getElementById('loading').style.display = 'none';
                            grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-dim);">No Mobile products available right now.</p>';
                        }
                    });
                }
            });
        }

        function openModal(product) {
            selectedProduct = product;
            document.getElementById('modalProdName').innerText = product.name || product.title || 'Mobile Panel';
            const pkgList = document.getElementById('packageList');
            pkgList.innerHTML = '';

            let pkgArray = [];
            if (product.packages) {
                pkgArray = Object.entries(product.packages).map(([id, pkg]) => ({ ...pkg, id }));
            } else {
                pkgArray = [{ id: 'default', qty: 1, unit: 'Days', price: getSafePrice(product) }];
            }

            pkgArray.forEach((pkg, index) => {
                const price = getSafePrice(pkg);
                const label = pkg.unit === 'Lifetime' ? 'Lifetime' : `${pkg.qty || 1} ${pkg.unit || 'Days'}`;
                
                const div = document.createElement('div');
                div.className = `package-option ${index === 0 ? 'active' : ''}`;
                if(index === 0) selectedPackage = { ...pkg, price };
                
                div.innerHTML = `
                    <div style="font-weight:bold; font-size:1.1rem; color:#fff;">${label}</div>
                    <div style="color: var(--neon-green); font-weight:bold; font-size:1.2rem; font-family:'Orbitron', sans-serif;">৳${price}</div>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.package-option').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    selectedPackage = { ...pkg, price };
                };
                pkgList.appendChild(div);
            });

            document.getElementById('purchaseModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('purchaseModal').style.display = 'none'; }

        async function processPurchase() {
            const discordUser = document.getElementById('discordUser').value.trim();
            if (!discordUser) return alert("Please enter your Discord Username or User ID");
            if (!selectedPackage) return alert("Please select a package.");

            const btn = document.querySelector('.buy-now-btn');
            btn.innerText = "CREATING TICKET...";
            btn.disabled = true;

            const pkgText = selectedPackage.unit === 'Lifetime' ? 'Lifetime' : `${selectedPackage.qty || 1} ${selectedPackage.unit || 'Days'}`;
            const finalPrice = getSafePrice(selectedPackage);

            const ticketData = {
                discordUserId: discordUser,
                productName: selectedProduct.name || selectedProduct.title || 'Mobile Panel',
                packageName: pkgText,
                price: finalPrice,
                paymentDetails: `
**__Payment Numbers__**
> bKash Personal: \`01869942698\`
> Nagad Personal: \`01624528622\`

**__Instructions__**
1. Send Money (৳${finalPrice}) to any number above.
2. Provide your Transaction ID and Screenshot in this ticket.
3. Wait for <@&1560738050743468135> or <@&1560738926581252248> to verify.`
            };

            try {
                const res = await fetch('https://bangla-ff-bot-server.onrender.com/create-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ticketData)
                });
                const result = await res.json();
                if (result.success) {
                    window.location.href = result.url;
                } else {
                    alert("Error: " + result.message);
                }
            } catch (err) {
                alert("Failed to connect to Bot Server.");
            } finally {
                btn.innerText = "GET TICKET & PURCHASE";
                btn.disabled = false;
            }
        }

        loadContent();
    </script>
</body>
</html>
