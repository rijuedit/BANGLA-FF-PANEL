<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Mobile Panel - BANGLA FF PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05020a;
            --card-bg: #0b0512;
            --border-color: #1a0b2e;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --text-light: #ffffff;
            --text-gray: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .bg-glow {
            position: absolute; top: 10%; left: 30%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.1) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(5, 2, 10, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }

        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .site-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--neon-pink); }
        .brand-text h2 { font-size: 16px; color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .brand-text p { font-size: 9px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; }

        .nav-btns { display: flex; gap: 12px; }
        .header-btn {
            background: transparent; border: 1px solid #333; color: white;
            padding: 8px 15px; border-radius: 6px; font-size: 12px; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .header-btn:hover { border-color: white; }

        .content-container { max-width: 1000px; margin: 40px auto 60px; padding: 0 20px; flex: 1; width: 100%; }

        .page-title { font-size: 24px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; text-align: center; }
        .page-subtitle { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; margin-bottom: 35px; text-transform: uppercase; text-align: center; }

        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
        }

        .product-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; text-align: center; transition: 0.3s; position: relative;
        }
        .product-card:hover { border-color: var(--neon-purple); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(157, 0, 255, 0.15); }

        .product-img {
            width: 100%; height: 160px; border-radius: 8px; object-fit: cover; margin-bottom: 15px; border: 1px solid var(--border-color);
        }

        .product-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .product-price-start { font-size: 12px; color: var(--neon-pink); font-weight: bold; margin-bottom: 20px; }

        .buy-btn {
            width: 100%; background: var(--neon-pink); color: white; border: none; padding: 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 12px; text-transform: uppercase;
        }
        .buy-btn:hover { box-shadow: 0 0 12px var(--neon-pink); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--card-bg); border: 2px solid var(--neon-purple);
            width: 420px; padding: 25px; border-radius: 12px; box-shadow: 0 0 30px rgba(157, 0, 255, 0.3);
        }
        .modal-title { font-size: 18px; font-weight: bold; color: var(--neon-pink); margin-bottom: 20px; text-transform: uppercase; }
        .pkg-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
        .pkg-item {
            background: #06020c; border: 1px solid var(--border-color); padding: 12px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s;
        }
        .pkg-item:hover, .pkg-item.selected { border-color: var(--neon-pink); background: rgba(255, 0, 102, 0.05); }
        .pkg-dur { font-weight: bold; font-size: 13px; }
        .pkg-price { color: var(--neon-pink); font-weight: bold; font-size: 13px; }

        .modal-footer { display: flex; gap: 10px; }
        .confirm-btn { background: var(--neon-purple); color: white; border: none; padding: 12px; flex: 1; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cancel-btn { background: transparent; border: 1px solid var(--text-gray); color: var(--text-gray); padding: 12px; flex: 1; border-radius: 6px; cursor: pointer; }

        @media (max-width: 768px) { .header { padding: 15px 20px; } }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header class="header">
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Logo" class="site-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888879.png'">
            <div class="brand-text">
                <h2>BANGLA FF PANEL</h2>
                <p>PREMIUM CORP</p>
            </div>
        </a>
        <div class="nav-btns">
            <a href="index.html" class="header-btn"><i class="fas fa-home"></i> Home</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="header-btn"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <div class="content-container">
        <h2 class="page-title">Paid Mobile Panels</h2>
        <div class="page-subtitle">SAFE VIP SOLUTIONS FOR ANDROID & IOS</div>

        <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- Purchase Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <div class="modal-title" id="mProductTitle">Order Mobile Panel</div>
            <div style="font-size:12px; color:var(--text-gray); margin-bottom:10px;">Select Duration Package:</div>
            <div class="pkg-list" id="mPkgList"></div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="confirm-btn" id="mConfirmBtn">Proceed to Buy</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalBuyLink = "https://discord.gg/ZBjSWaF7u";
        let activePanels = {};

        // Fetch Global Buy Link
        get(ref(db, 'site_settings/mobile_panel/buy_link')).then(s => {
            if (s.exists() && s.val()) globalBuyLink = s.val();
        });

        // Fetch Mobile Panels
        onValue(ref(db, 'mobile_panels'), (snapshot) => {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = "";
            activePanels = snapshot.val() || {};

            snapshot.forEach(child => {
                const item = child.val();
                const key = child.key;
                let minPrice = "N/A";

                if (item.packages && item.packages.length > 0) {
                    minPrice = "৳ " + item.packages[0].sell_price;
                }

                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${item.image}" class="product-img" onerror="this.src='https://via.placeholder.com/300x160?text=Mobile+Panel'">
                        <div class="product-name">${item.title}</div>
                        <div class="product-price-start">Starts at ${minPrice}</div>
                        <button class="buy-btn" onclick="openOrderModal('${key}')">Buy Panel</button>
                    </div>
                `;
            });
        });

        let selectedPkg = null;

        window.openOrderModal = function(key) {
            const item = activePanels[key];
            if (!item) return;

            document.getElementById('mProductTitle').innerText = item.title;
            const pkgList = document.getElementById('mPkgList');
            pkgList.innerHTML = "";
            selectedPkg = null;

            if (item.packages && item.packages.length > 0) {
                item.packages.forEach((pkg, idx) => {
                    pkgList.innerHTML += `
                        <div class="pkg-item ${idx===0?'selected':''}" onclick="selectPackage(this, ${idx}, '${key}')">
                            <span class="pkg-dur">${pkg.duration}</span>
                            <span class="pkg-price">৳ ${pkg.sell_price}</span>
                        </div>
                    `;
                });
                selectedPkg = item.packages[0];
            } else {
                pkgList.innerHTML = `<div style="color:#777; font-size:12px;">No packages available.</div>`;
            }

            document.getElementById('orderModal').style.display = 'flex';
        };

        window.selectPackage = function(el, idx, key) {
            document.querySelectorAll('.pkg-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedPkg = activePanels[key].packages[idx];
        };

        window.closeModal = function() {
            document.getElementById('orderModal').style.display = 'none';
        };

        document.getElementById('mConfirmBtn').addEventListener('click', () => {
            if (globalBuyLink) {
                window.open(globalBuyLink, '_blank');
            } else {
                alert("Redirecting to support...");
                window.open("https://discord.gg/ZBjSWaF7u", '_blank');
            }
        });
    </script>
</body>
</html>
