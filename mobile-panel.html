<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Panel Premium - BANGLA FF PANEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #05020a; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; min-height: 100vh; }
        .navbar-custom { background: #0c0514; border-bottom: 1px solid #2a113d; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .logo-img { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #9d00ff; object-fit: cover; }
        .btn-back { background: rgba(157, 0, 255, 0.15); border: 1px solid #9d00ff; color: white; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; text-decoration: none; }
        .btn-discord { background: #ff0066; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; text-decoration: none; }
        .container-custom { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 1px solid #9d00ff; margin-bottom: 15px; }
        .product-title { color: #ffffff; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .btn-buy { background: #9d00ff; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 8px; width: 100%; }
        .modal-content { background-color: #11071a; border: 1px solid #ff0066; border-radius: 16px; color: white; }
        .pkg-option { background: #0c0514; border: 1px solid #2a113d; border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .pkg-option.selected { border-color: #00cc66; background: rgba(0, 204, 102, 0.08); }
        .pkg-price { color: #00cc66; font-weight: 800; }
        .user-id-input { background: #05020a; border: 1px solid #2a113d; color: white; border-radius: 8px; padding: 10px; width: 100%; margin-top: 15px; }
        .btn-order-ticket { background: #00cc66; color: #000; font-weight: 800; padding: 12px; border-radius: 8px; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <a href="index.html" class="btn-back">Back</a>
        <div class="d-flex align-items-center gap-2">
            <img src="logo.png" alt="Logo" class="logo-img">
            <span style="font-weight: 800; color: #ffffff;">BANGLA FF PANEL</span>
        </div>
        <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="btn-discord">Discord</a>
    </div>

    <div class="container-custom">
        <h2 class="text-center mb-4" style="font-weight: 800;">MOBILE PANEL PREMIUM</h2>
        <div id="productGrid" class="product-grid"></div>
    </div>

    <div class="modal fade" id="buyModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="modalProductName">PRODUCT NAME</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div id="modalPackagesList"></div>
                    <input type="text" id="discordUserIdInput" class="user-id-input" placeholder="আপনার Discord Username অথবা ID দিন (Optional)">
                    <button id="btnSubmitTicket" class="btn-order-ticket" onclick="submitOrder()">NEXT: ORDER TICKET</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const buyModal = new bootstrap.Modal(document.getElementById('buyModal'));
        let allProducts = {};
        let selectedProduct = null;
        let selectedPkg = null;

        function getSafePrice(pkg) {
            if (!pkg) return 0;
            const keys = ['newPrice', 'price', 'salePrice', 'new_price', 'sale_price', 'oldPrice'];
            for (let k of keys) if (pkg[k] && pkg[k] != 0) return pkg[k];
            for (let k in pkg) if (typeof pkg[k] === 'number' && pkg[k] > 0) return pkg[k];
            return 0;
        }

        database.ref('mobile_panels').on('value', snap => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            allProducts = snap.val() || {};
            snap.forEach(child => {
                const product = child.val();
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `<img src="${product.imageUrl || 'logo.png'}" class="product-img"><div class="product-title">${product.name || 'Mobile Panel'}</div><button class="btn-buy" onclick="openBuyModal('${child.key}')">BUY NOW</button>`;
                grid.appendChild(card);
            });
        });

        function openBuyModal(id) {
            selectedProduct = allProducts[id];
            document.getElementById('modalProductName').innerText = selectedProduct.name || 'Mobile Panel';
            const list = document.getElementById('modalPackagesList');
            list.innerHTML = '';
            const pkgs = Array.isArray(selectedProduct.packages) ? selectedProduct.packages : Object.values(selectedProduct.packages || {});
            pkgs.forEach((pkg, index) => {
                const div = document.createElement('div');
                div.className = `pkg-option ${index === 0 ? 'selected' : ''}`;
                div.onclick = () => { document.querySelectorAll('.pkg-option').forEach(el => el.classList.remove('selected')); div.classList.add('selected'); selectedPkg = pkg; };
                div.innerHTML = `<span>${pkg.duration || 'Pkg'}</span><span class="pkg-price">৳${getSafePrice(pkg)} BDT</span>`;
                list.appendChild(div);
                if (index === 0) selectedPkg = pkg;
            });
            buyModal.show();
        }

        function submitOrder() {
            if (!selectedPkg) return;
            const btn = document.getElementById('btnSubmitTicket');
            btn.disabled = true;
            fetch("https://bangla-ff-bot-server.onrender.com/create-ticket", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ discordUserId: document.getElementById('discordUserIdInput').value, packageName: selectedPkg.duration, price: getSafePrice(selectedPkg), productTitle: selectedProduct.name })
            }).then(r => r.json()).then(d => d.success ? window.location.href = d.url : alert("Error")).catch(() => btn.disabled = false);
        }
    </script>
</body>
</html>
