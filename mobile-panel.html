<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Panel - BANGLA FF PANEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="style.css">
  <style>
    .inner-page-container{width:calc(100% - 40px);max-width:700px;margin:60px auto 80px;position:relative;z-index:1}
    .inner-header-actions{display:flex;justify-content:space-between;margin-bottom:24px}
    .back-btn,.share-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
    .back-btn:hover,.share-btn:hover{border-color:#00f2fe;color:#fff}
    .mobile-card{
      background:rgba(13,15,26,.8);border:1px solid rgba(0,242,254,.2);border-radius:20px;
      padding:48px 32px;text-align:center;backdrop-filter:blur(12px);
      box-shadow:0 0 40px rgba(0,242,254,.08);
    }
    .mobile-icon{
      width:80px;height:80px;border-radius:20px;margin:0 auto 24px;
      background:rgba(0,242,254,.1);border:1px solid rgba(0,242,254,.3);
      display:grid;place-items:center;font-size:40px;color:#00f2fe;
    }
    .mobile-card h2{font-size:28px;font-weight:900;color:#fff;margin:0 0 12px;letter-spacing:1px}
    .mobile-msg{
      font-size:15px;color:#94a3b8;line-height:1.7;margin:0 0 32px;
      max-width:420px;margin-left:auto;margin-right:auto;
    }
    .ticket-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      background:linear-gradient(135deg,rgba(0,242,254,.2),rgba(88,101,242,.3));
      border:1px solid #00f2fe;color:#fff;padding:16px 40px;border-radius:14px;
      font-size:16px;font-weight:900;text-decoration:none;letter-spacing:2px;
      text-transform:uppercase;box-shadow:0 0 25px rgba(0,242,254,.25);transition:.3s;
    }
    .ticket-btn:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(0,242,254,.45);color:#fff}
    .ticket-btn i{font-size:22px}
  </style>
</head>
<body>
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>
  <div class="mouse-glow"></div>

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo"><img src="logo.png" alt="Logo" class="site-logo"></span>
      <span class="brand-text"><strong>BANGLA FF PANEL</strong><small>COMMUNITY • GAMING HUB</small></span>
    </a>
    <nav class="top-actions">
      <a class="home-btn" href="index.html">Home</a>
      <a class="discord-btn" href="https://discord.gg/9VGgu48bY" target="_blank"><span class="discord-mark">◉</span> Discord</a>
    </nav>
  </header>

  <main class="inner-page-container">
    <div class="inner-header-actions">
      <a href="index.html" class="back-btn"><i class='bx bx-left-arrow-alt'></i> Back</a>
      <button class="share-btn"><i class='bx bx-share-alt'></i> Share</button>
    </div>

    <div class="mobile-card">
      <div class="mobile-icon"><i class='bx bx-mobile-alt'></i></div>
      <h2>MOBILE PANEL</h2>
      <p class="mobile-msg" id="mp-message-text">
        Mobile panel কিনতে Ticket এ যোগাযোগ করুন
      </p>
      <a href="#" target="_blank" class="ticket-btn" id="mp-ticket-btn">
        <i class='bx bx-purchase-tag'></i>
        <span id="mp-btn-label">TICKET</span>
      </a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
