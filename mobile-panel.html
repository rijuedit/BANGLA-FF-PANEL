<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Panels | BR MODS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #fff;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      background: linear-gradient(135deg, #101b35, #241044);
      border-bottom: 1px solid #293653;
    }

    header h1 {
      margin: 0 0 8px;
      color: #69a9ff;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #c2cce0;
      font-size: 14px;
    }

    .container {
      width: min(1100px, 94%);
      margin: 24px auto;
    }

    .status {
      padding: 14px;
      margin-bottom: 18px;
      text-align: center;
      color: #b8c7df;
      background: #111a2c;
      border: 1px solid #263653;
      border-radius: 10px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      overflow: hidden;
      background: #121a2a;
      border: 1px solid #293750;
      border-radius: 15px;
      box-shadow: 0 8px 25px #0004;
    }

    .card img {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: contain;
      padding: 10px;
      background: #0e1523;
    }

    .card-body { padding: 16px; }

    .card h2 {
      margin: 0 0 14px;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .package {
      margin: 10px 0;
      padding: 12px;
      background: #0b1220;
      border: 1px solid #273650;
      border-radius: 10px;
    }

    .package-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .duration { font-weight: bold; }

    .prices {
      margin-top: 8px;
      color: #9fb0ca;
      font-size: 14px;
    }

    .old-price {
      margin-right: 7px;
      color: #8993a5;
      text-decoration: line-through;
    }

    .new-price {
      color: #62e6a3;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(90deg, #2878ff, #7646ee);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 30px 15px;
      text-align: center;
      color: #b9c6dc;
      background: #121a2a;
      border: 1px solid #293750;
      border-radius: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #000b;
    }

    .modal.show { display: flex; }

    .modal-box {
      width: min(430px, 100%);
      padding: 22px;
      background: #121a2a;
      border: 1px solid #344563;
      border-radius: 14px;
    }

    .modal-box h2 { margin-top: 0; }

    .modal-box input {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      color: #fff;
      background: #0b1220;
      border: 1px solid #344563;
      border-radius: 8px;
      outline: none;
    }

    .cancel {
      background: #303b50;
    }

    footer {
      padding: 24px 12px;
      color: #8190a8;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>BR MODS</h1>
    <p>Mobile Panel Store</p>
  </header>

  <main class="container">
    <div id="status" class="status">প্যানেল লোড হচ্ছে...</div>
    <section id="products" class="products"></section>
  </main>

  <div id="orderModal" class="modal">
    <div class="modal-box">
      <h2>অর্ডার করুন</h2>
      <div id="selectedInfo" class="status"></div>

      <form id="orderForm">
        <input id="customerName" placeholder="আপনার নাম" required>
        <input id="customerContact" placeholder="Discord Username / Contact" required>
        <button id="submitOrder" type="submit">অর্ডার কনফার্ম করুন</button>
        <button class="cancel" type="button" onclick="closeOrder()">বাতিল</button>
      </form>
    </div>
  </div>

  <footer>© BR MODS — Mobile Panels</footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const database = firebase.database();
    const productsEl = document.getElementById("products");
    const statusEl = document.getElementById("status");

    const ORDER_API =
      "https://bangla-ff-bot-server.onrender.com/create-ticket";

    let selectedOrder = null;

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getPackages(rawPackages) {
      if (!rawPackages) return [];

      const values = Array.isArray(rawPackages)
        ? rawPackages
        : Object.values(rawPackages);

      return values.filter(pkg => pkg && typeof pkg === "object");
    }

    function getPrice(pkg) {
      return Number(
        pkg.newPrice ??
        pkg.salePrice ??
        pkg.sell_price ??
        pkg.price ??
        0
      );
    }

    function getOldPrice(pkg) {
      return Number(pkg.oldPrice ?? pkg.old_price ?? 0);
    }

    function getDuration(pkg) {
      return pkg.duration ?? pkg.name ?? pkg.title ?? "Package";
    }

    function getImage(product) {
      return product.imageUrl ?? product.image ?? product.img ?? "";
    }

    function renderProduct(product, id) {
      const name = product.name ?? product.title ?? "Mobile Panel";
      const image = getImage(product);
      const packages = getPackages(product.packages);

      const packageHTML = packages.map((pkg, index) => {
        const price = getPrice(pkg);
        const oldPrice = getOldPrice(pkg);
        const duration = getDuration(pkg);

        return `
          <div class="package">
            <div class="package-top">
              <span class="duration">${escapeHTML(duration)}</span>
              <span class="new-price">৳${escapeHTML(price)}</span>
            </div>

            <div class="prices">
              ${oldPrice > price
                ? `<span class="old-price">৳${escapeHTML(oldPrice)}</span>`
                : ""}
              <span>টাকা</span>
            </div>

            <button type="button"
              onclick="openOrder('${escapeHTML(id)}', ${index})">
              Buy Now
            </button>
          </div>
        `;
      }).join("");

      return `
        <article class="card">
          ${image
            ? `<img src="${escapeHTML(image)}"
                 alt="${escapeHTML(name)}"
                 loading="lazy"
                 onerror="this.style.display='none'">`
            : ""}
          <div class="card-body">
            <h2>${escapeHTML(name)}</h2>
            ${packageHTML || '<p>এই প্যানেলের কোনো প্যাকেজ পাওয়া যায়নি।</p>'}
          </div>
        </article>
      `;
    }

    function loadProducts() {
      database.ref("mobile_panels").on("value", snapshot => {
        productsEl.innerHTML = "";

        if (!snapshot.exists()) {
          statusEl.textContent = "এখনো কোনো Mobile Panel যোগ করা হয়নি।";
          productsEl.innerHTML =
            '<div class="empty">কোনো প্যানেল পাওয়া যায়নি।</div>';
          return;
        }

        const data = snapshot.val();
        const entries = Object.entries(data).filter(([id, product]) =>
          product && typeof product === "object"
        );

        if (!entries.length) {
          statusEl.textContent = "কোনো প্যানেল পাওয়া যায়নি।";
          return;
        }

        statusEl.textContent = `মোট ${entries.length}টি Mobile Panel পাওয়া গেছে।`;

        productsEl.innerHTML = entries
          .map(([id, product]) => renderProduct(product, id))
          .join("");
      }, error => {
        console.error("Firebase read error:", error);
        statusEl.textContent =
          "প্যানেল লোড করা যায়নি। ব্রাউজারের Console-এ error দেখুন।";
      });
    }

    function openOrder(productId, packageIndex) {
      database.ref("mobile_panels/" + productId).once("value")
        .then(snapshot => {
          if (!snapshot.exists()) {
            alert("এই প্যানেলটি আর পাওয়া যাচ্ছে না।");
            return;
          }

          const product = snapshot.val();
          const packages = getPackages(product.packages);
          const pkg = packages[packageIndex];

          if (!pkg) {
            alert("প্যাকেজটি পাওয়া যায়নি।");
            return;
          }

          selectedOrder = {
            category: "MOBILE PANEL",
            panelName: product.name ?? product.title ?? "Mobile Panel",
            duration: getDuration(pkg),
            price: getPrice(pkg),
            productId,
            packageIndex
          };

          document.getElementById("selectedInfo").textContent =
            `${selectedOrder.panelName} — ${selectedOrder.duration} — ৳${selectedOrder.price}`;

          document.getElementById("orderModal").classList.add("show");
        })
        .catch(error => {
          console.error(error);
          alert("প্যানেলের তথ্য লোড করা যায়নি।");
        });
    }

    function closeOrder() {
      document.getElementById("orderModal").classList.remove("show");
    }

    document.getElementById("orderForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!selectedOrder) {
        alert("আগে একটি প্যাকেজ নির্বাচন করুন।");
        return;
      }

      const button = document.getElementById("submitOrder");
      button.disabled = true;
      button.textContent = "অপেক্ষা করুন...";

      const payload = {
        ...selectedOrder,
        customerName: document.getElementById("customerName").value.trim(),
        customerContact: document.getElementById("customerContact").value.trim()
      };

      try {
        const response = await fetch(ORDER_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.message || result.error || "অর্ডার পাঠানো যায়নি।");
        }

        alert("অর্ডার রিকোয়েস্ট পাঠানো হয়েছে!");
        closeOrder();
        document.getElementById("orderForm").reset();
      } catch (error) {
        console.error("Order error:", error);
        alert("অর্ডার পাঠানো যায়নি: " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = "অর্ডার কনফার্ম করুন";
      }
    });

    loadProducts();
  </script>
</body>
</html>
```
