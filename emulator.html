<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF PANEL - EMULATORS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #11071a;
            --border-color: #2a113d;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --neon-green: #00cc66;
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; cursor: default; }

        body { background-color: var(--bg-color); color: white; min-height: 100vh; overflow-x: hidden; }

        /* Mouse Glow */
        #mouse-glow {
            position: fixed; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: 0; transform: translate(-50%, -50%); transition: 0.1s;
        }

        .header {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(12, 5, 20, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        .logo-box { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--neon-pink); }
        .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 1; }

        /* Video Section */
        .video-box {
            width: 100%; aspect-ratio: 16/9; background: #000;
            border: 2px solid var(--border-color); border-radius: 20px;
            overflow: hidden; margin-bottom: 25px; position: relative;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
        }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .video-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0c0514; color: var(--text-gray);
        }

        .action-row { display: flex; gap: 15px; margin-bottom: 40px; }
        .skip-btn {
            flex: 1; background: linear-gradient(45deg, var(--neon-purple), #7b00cc);
            color: white; text-decoration: none; padding: 15px; border-radius: 12px;
            text-align: center; font-weight: bold; text-transform: uppercase; cursor: pointer;
        }

        /* Emulator Grid */
        .emu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .emu-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 25px; border-radius: 20px; text-align: center; transition: 0.3s;
        }
        .emu-card:hover { transform: translateY(-5px); border-color: var(--neon-pink); }
        .emu-icon { width: 70px; height: 70px; object-fit: contain; margin-bottom: 15px; }
        .emu-emoji { font-size: 50px; display: block; margin-bottom: 15px; }
        .emu-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; display: block; }
        .download-btn {
            background: rgba(255, 0, 102, 0.1); color: var(--neon-pink);
            text-decoration: none; padding: 10px 20px; border-radius: 30px;
            border: 1px solid var(--neon-pink); font-size: 0.9rem; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <header class="header">
        <a href="index.html" class="logo-box">
            <img src="logo.png" class="logo-img">
            <span class="logo-text">BANGLA FF PANEL</span>
        </a>
    </header>

    <div class="container">
        <!-- Tutorial Video -->
        <div class="video-box" id="yt-container">
            <div class="video-placeholder">
                <i class="fas fa-video-slash fa-3x" style="margin-bottom: 15px;"></i>
                <p>Tutorial Video Coming Soon...</p>
            </div>
        </div>

        <div class="action-row" id="skip-row" style="display: none;">
            <a href="#" id="skip-link" class="skip-btn" target="_blank"><i class="fas fa-play-circle"></i> SKIP LINK / WATCH TUTORIAL</a>
        </div>

        <h2 style="margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px;">Available Emulators</h2>

        <div class="emu-grid" id="emu-list">
            <!-- Items from Firebase -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Load Page Settings (Video)
        onValue(ref(db, 'page_settings/emulator'), (snap) => {
            if(snap.exists()){
                const data = snap.val();
                if(data.yt_link) {
                    const videoId = data.yt_link.split('v=')[1] || data.yt_link.split('/').pop();
                    document.getElementById('yt-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                }
                if(data.skip_link) {
                    document.getElementById('skip-row').style.display = 'flex';
                    document.getElementById('skip-link').href = data.skip_link;
                }
            }
        });

        // Load Emulators
        onValue(ref(db, 'emulators'), (snapshot) => {
            const list = document.getElementById('emu-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                const card = document.createElement('div');
                card.className = 'emu-card';
                
                let iconHtml = item.iconType === 'image' 
                    ? `<img src="${item.iconValue}" class="emu-icon">`
                    : `<span class="emu-emoji">${item.iconValue}</span>`;

                card.innerHTML = `
                    ${iconHtml}
                    <span class="emu-name">${item.title}</span>
                    <a href="${item.download}" class="download-btn" target="_blank">DOWNLOAD NOW</a>
                `;
                list.appendChild(card);
            });
        });

        // Mouse Glow
        const glow = document.getElementById('mouse-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
