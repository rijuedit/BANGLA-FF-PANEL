<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGLA FF PANEL - EMULATORS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #0c0514;
            --border-color: #2a113d;
            --neon-pink: #ff0066;
            --neon-purple: #9d00ff;
            --neon-green: #00cc66;
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; cursor: default; }

        body { background-color: var(--bg-color); color: white; min-height: 100vh; overflow-x: hidden; }

        /* Mouse Glow */
        #mouse-glow {
            position: fixed; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.15) 0%, transparent 70%);
            pointer-events: none; z-index: 0; transform: translate(-50%, -50%); transition: 0.1s;
        }

        .header {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(12, 5, 20, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        .logo-box { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--neon-pink); }
        .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 1; }

        /* Video Section */
        .video-box {
            width: 100%; aspect-ratio: 16/9; background: #000;
            border: 1px solid var(--border-color); border-radius: 15px;
            overflow: hidden; margin-bottom: 25px; position: relative;
        }
        .video-box iframe { width: 100%; height: 100%; border: none; }
        .video-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0c0514; color: var(--text-gray);
        }

        .section-header { margin-bottom: 15px; }
        .section-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .section-sub { color: var(--text-gray); font-size: 0.9rem; }

        /* RAR Password Box */
        .password-box {
            border: 1px solid #ff9900; background: rgba(255, 153, 0, 0.05);
            border-radius: 10px; padding: 15px 20px; margin-bottom: 30px;
            display: none; /* Hidden by default */
        }
        .pass-header { color: #ff9900; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .pass-content { display: flex; justify-content: space-between; align-items: center; }
        .pass-content span { font-size: 1.2rem; font-weight: bold; color: white; }
        .copy-btn {
            background: transparent; border: 1px solid #ff9900; color: #ff9900;
            padding: 6px 15px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 0.85rem;
        }
        .copy-btn:hover { background: #ff9900; color: black; }

        /* Emulator Grid */
        .emu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .emu-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 20px; border-radius: 15px; transition: 0.3s;
        }
        .emu-card:hover { border-color: var(--neon-purple); transform: translateY(-3px); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .cube-icon {
            width: 45px; height: 45px; background: rgba(157, 0, 255, 0.1);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: var(--neon-purple); font-size: 22px;
        }
        .live-badge {
            color: #00ff00; font-size: 0.75rem; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }
        .live-badge::before { content: ''; width: 6px; height: 6px; background: #00ff00; border-radius: 50%; display: block; }

        .emu-name { font-weight: 800; font-size: 1.1rem; margin-bottom: 15px; display: block; text-transform: uppercase; }
        
        .download-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(157, 0, 255, 0.2); color: var(--neon-purple);
            text-decoration: none; padding: 8px 15px; border-radius: 8px;
            font-size: 0.85rem; font-weight: bold; transition: 0.3s; cursor: pointer;
        }
        .download-btn:hover { background: var(--neon-purple); color: white; }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <header class="header">
        <a href="index.html" class="logo-box">
            <img src="logo.png" class="logo-img">
            <span class="logo-text">BANGLA FF PANEL</span>
        </a>
    </header>

    <div class="container">
        <!-- Tutorial Video -->
        <div class="video-box" id="yt-container">
            <div class="video-placeholder">
                <i class="fas fa-video-slash fa-3x" style="margin-bottom: 15px;"></i>
                <p>Tutorial Video Coming Soon...</p>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title">EMULATOR</h2>
            <div class="section-sub">Working Emulator</div>
        </div>

        <!-- RAR Password Box -->
        <div class="password-box" id="rar-container">
            <div class="pass-header"><i class="fas fa-lock"></i> RAR PASSWORD</div>
            <div class="pass-content">
                <span id="rar-text"></span>
                <button class="copy-btn" onclick="copyRar()"><i class="far fa-copy"></i> Copy</button>
            </div>
        </div>

        <!-- Grid -->
        <div class="emu-grid" id="emu-list">
            <!-- Items from Firebase -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Load Page Settings (Video & RAR Pass)
        onValue(ref(db, 'page_settings/emulator'), (snap) => {
            if(snap.exists()){
                const data = snap.val();
                if(data.yt_link) {
                    const videoId = data.yt_link.split('v=')[1] || data.yt_link.split('/').pop();
                    document.getElementById('yt-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                }
                
                if(data.rar_password) {
                    document.getElementById('rar-container').style.display = 'block';
                    document.getElementById('rar-text').innerText = data.rar_password;
                } else {
                    document.getElementById('rar-container').style.display = 'none';
                }
            }
        });

        // Copy RAR Pass Function
        window.copyRar = () => {
            const text = document.getElementById('rar-text').innerText;
            navigator.clipboard.writeText(text);
            const btn = document.querySelector('.copy-btn');
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => btn.innerHTML = '<i class="far fa-copy"></i> Copy', 2000);
        };

        // Load Emulators
        onValue(ref(db, 'emulators'), (snapshot) => {
            const list = document.getElementById('emu-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const item = child.val();
                const card = document.createElement('div');
                card.className = 'emu-card';
                card.innerHTML = `
                    <div class="card-top">
                        <div class="cube-icon"><i class="fas fa-cube"></i></div>
                        <div class="live-badge">LIVE</div>
                    </div>
                    <span class="emu-name">${item.title}</span>
                    <a href="${item.download}" class="download-btn" target="_blank">
                        <i class="fas fa-arrow-down"></i> Download
                    </a>
                `;
                list.appendChild(card);
            });
        });

        // Mouse Glow
        const glow = document.getElementById('mouse-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
