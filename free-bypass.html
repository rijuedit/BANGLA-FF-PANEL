<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Bypass - BANGLA FF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background-color: #05020a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        #mouse-glow { position: fixed; width: 50px; height: 50px; border-radius: 50%; background: rgba(0, 204, 102, 0.4); filter: blur(30px); pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: rgba(17, 7, 26, 0.9); border-bottom: 1px solid #2a113d; sticky: top; }
        .logo { font-size: 26px; font-weight: 700; color: #fff; text-decoration: none; }
        .logo span { color: #00cc66; }
        .back-btn { background: #11071a; color: #fff; text-decoration: none; padding: 8px 16px; border: 1px solid #2a113d; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .back-btn:hover { border-color: #00cc66; color: #00cc66; }

        .container { flex: 1; padding: 30px 5%; max-width: 1200px; margin: 0 auto; width: 100%; }
        .page-title { font-size: 32px; text-transform: uppercase; margin-bottom: 30px; text-align: center; }
        .page-title span { color: #00cc66; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s; }
        .card:hover { border-color: #00cc66; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0, 204, 102, 0.2); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
        .card-title { font-size: 20px; font-weight: 700; color: #fff; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.3s; }
        .btn-main { background: #00cc66; color: #000; }
        .btn-main:hover { background: #00994d; color: #fff; }
        .btn-yt { background: #ff0000; color: #fff; }
        .btn-skip { background: #9d00ff; color: #fff; }

        #no-data { text-align: center; color: #aaa; font-size: 18px; grid-column: 1 / -1; padding: 50px 0; }
        #loader { text-align: center; color: #00cc66; font-size: 20px; padding: 50px 0; font-weight: 600; }
    </style>
</head>
<body>
    <div id="mouse-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="logo">BANGLA <span>FF</span></a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
    </nav>

    <main class="container">
        <h1 class="page-title">Free <span>Bypasses</span></h1>
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Loading Bypasses...</div>
        <div class="grid" id="grid-container"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('mouse-glow');
            glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px';
        });

        onValue(ref(db, 'free_bypass'), (snapshot) => {
            document.getElementById('loader').style.display = 'none';
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';

            if(!snapshot.exists()) {
                grid.innerHTML = '<div id="no-data">No Free Bypasses Available Right Now.</div>';
                return;
            }

            snapshot.forEach((child) => {
                const item = child.val();
                
                let ytBtnHTML = (item.yt_enabled !== false && item.yt_link) 
                    ? `<a href="${item.yt_link}" target="_blank" class="btn btn-yt"><i class="fab fa-youtube"></i> Watch Tutorial</a>` : '';

                let skipBtnHTML = (item.skip_enabled !== false && item.skip_link) 
                    ? `<a href="${item.skip_link}" target="_blank" class="btn btn-skip"><i class="fas fa-route"></i> How To Skip</a>` : '';

                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-title">${item.title}</div>
                        <div class="btn-group">
                            <a href="${item.download}" target="_blank" class="btn btn-main"><i class="fas fa-download"></i> ${item.btn_text || 'Download'}</a>
                            ${ytBtnHTML}
                            ${skipBtnHTML}
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
