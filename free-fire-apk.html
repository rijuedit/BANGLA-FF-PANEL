<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire APK - BANGLA FF PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #05020a;
            --card-bg: #0b0512;
            --border-color: #1a0b2e;
            --neon-pink: #ff0066;
            --text-light: #ffffff;
            --text-gray: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .bg-glow {
            position: absolute; top: 10%; left: 30%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 102, 0.1) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(5, 2, 10, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }

        .brand { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; }
        .site-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 1px solid var(--neon-pink); }
        .brand-text h2 { font-size: 16px; color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .brand-text p { font-size: 9px; color: var(--text-gray); letter-spacing: 3px; text-transform: uppercase; }

        .nav-btns { display: flex; gap: 12px; }
        .header-btn {
            background: transparent; border: 1px solid #333; color: white;
            padding: 8px 15px; border-radius: 6px; font-size: 12px; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .header-btn:hover { border-color: white; }

        .content-container { max-width: 850px; margin: 40px auto 60px; padding: 0 20px; flex: 1; width: 100%; }

        .video-box {
            width: 100%; aspect-ratio: 16/9; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            overflow: hidden; margin-bottom: 30px; box-shadow: 0 0 20px rgba(255, 0, 102, 0.1);
        }
        .video-box iframe { width: 100%; height: 100%; border: none; }

        .page-title { font-size: 22px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .page-subtitle { font-size: 10px; color: var(--text-gray); letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; }

        .rar-box {
            background: var(--card-bg); border: 1px solid #ff9900;
            border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; display: none;
        }
        .rar-header {
            display: flex; justify-content: space-between; align-items: center;
            color: #ff9900; font-size: 10px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .rar-password { color: white; font-size: 16px; font-weight: bold; }
        .copy-btn {
            background: transparent; border: 1px solid #ff9900; color: #ff9900;
            padding: 5px 12px; border-radius: 4px; font-size: 10px; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 5px;
        }
        .copy-btn:hover { background: #ff9900; color: black; }

        .item-list { display: flex; flex-direction: column; gap: 15px; }
        .item-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
        }
        .item-card:hover { border-color: var(--neon-pink); transform: translateX(5px); }

        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-icon {
            background: rgba(255, 0, 102, 0.05); color: var(--neon-pink);
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 18px; border: 1px solid rgba(255, 0, 102, 0.1);
        }
        .item-title { font-size: 14px; font-weight: bold; color: white; text-transform: uppercase; }

        .download-btn {
            background: var(--neon-pink); color: white; padding: 8px 20px;
            border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold;
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .download-btn:hover { box-shadow: 0 0 10px var(--neon-pink); }

        @media (max-width: 768px) { .header { padding: 15px 20px; } }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header class="header">
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Logo" class="site-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/888/888879.png'">
            <div class="brand-text">
                <h2>BANGLA FF PANEL</h2>
                <p>PREMIUM CORP</p>
            </div>
        </a>
        <div class="nav-btns">
            <a href="index.html" class="header-btn"><i class="fas fa-home"></i> Home</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="header-btn"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <div class="content-container">
        <div class="video-box" id="video-container">
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#555;">Loading video...</div>
        </div>

        <h2 class="page-title">Free Fire APK</h2>
        <div class="page-subtitle">MODIFIED . LATEST . SAFE</div>

        <div class="rar-box" id="rar-box">
            <div class="rar-header">
                <span><i class="fas fa-lock"></i> RAR PASSWORD</span>
                <button class="copy-btn" id="copyBtn" onclick="copyPassword()"><i class="far fa-copy"></i> Copy</button>
            </div>
            <div class="rar-password" id="rar-password">...</div>
        </div>

        <div class="item-list" id="item-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'page_settings/apk'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                if (data.yt_link) {
                    let videoId = data.yt_link.split('v=')[1] || data.yt_link.split('youtu.be/')[1];
                    if(videoId) {
                        let amp = videoId.indexOf('&');
                        if(amp !== -1) videoId = videoId.substring(0, amp);
                        document.getElementById('video-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                    }
                } else {
                    document.getElementById('video-container').style.display = 'none';
                }

                if (data.rar_password && data.rar_password.trim() !== "") {
                    document.getElementById('rar-box').style.display = 'block';
                    document.getElementById('rar-password').innerText = data.rar_password;
                } else {
                    document.getElementById('rar-box').style.display = 'none';
                }
            }
        });

        window.copyPassword = function() {
            const pwd = document.getElementById('rar-password').innerText;
            navigator.clipboard.writeText(pwd).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
                setTimeout(() => { btn.innerHTML = `<i class="far fa-copy"></i> Copy`; }, 2000);
            });
        };

        onValue(ref(db, 'free_fire_apks'), (snapshot) => {
            const list = document.getElementById('item-list');
            list.innerHTML = "";
            snapshot.forEach(child => {
                const data = child.val();
                list.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <div class="item-icon"><i class="fas fa-bolt"></i></div>
                            <div class="item-title">${data.title}</div>
                        </div>
                        <a href="${data.download}" target="_blank" class="download-btn">
                            <i class="fas fa-download"></i> ${data.btn_text || 'Download'}
                        </a>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
