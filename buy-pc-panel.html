<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla FF Panel - PC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --neon-green: #00ff7f;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Mouse Glow Effect */
        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navbar */
        .navbar {
            background: rgba(13, 8, 24, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-purple);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            border: 1px solid var(--neon-purple);
            padding: 6px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Video Container */
        .video-container {
            max-width: 800px;
            margin: 20px auto;
            border: 1.5px solid var(--neon-purple);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: #0f0a1d;
            border: 1.5px solid #1f1a2e;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .product-card:hover { border-color: var(--neon-purple); transform: translateY(-5px); }

        .product-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #2d2640;
        }

        .btn-buy {
            background: linear-gradient(90deg, #d400ff, #ff007f);
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        /* Modal Design */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--neon-pink);
            border-radius: 15px;
            position: relative;
            padding: 25px;
        }

        .modal-title {
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .package-item {
            background: #07030b;
            border: 1px solid #2d2640;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .package-item:hover, .package-item.selected {
            border-color: var(--neon-green);
        }

        .package-item.selected { background: rgba(0, 255, 127, 0.05); }

        .package-info { display: flex; align-items: center; gap: 10px; }
        .package-info i { color: #facc15; font-size: 14px; }
        .package-price { color: var(--neon-green); font-weight: bold; }

        .discord-input {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            outline: none;
        }

        .discord-input:focus { border-color: var(--neon-pink); }

        .btn-ticket {
            background: #00ff7f;
            color: #000;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .close-modal { position: absolute; top: 15px; right: 15px; color: #666; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-btn">BACK</a>
        <div class="orbitron text-white text-lg font-bold">BANGLA FF PANEL</div>
        <a href="https://discord.gg/ZBjSWaF7u" class="nav-btn">DISCORD</a>
    </nav>

    <div id="videoSection" class="video-container hidden">
        <div id="videoFrame"></div>
    </div>

    <div class="text-center mt-10">
        <h1 class="orbitron text-2xl font-bold uppercase"><i class="fas fa-desktop text-neon-pink"></i> PC PANEL PREMIUM</h1>
    </div>

    <div class="product-grid" id="productGrid"></div>

    <!-- Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalProductTitle" class="modal-title">PRODUCT NAME</div>
            
            <div id="packageList"></div>

            <input type="text" id="discordUser" class="discord-input" placeholder="আপনার Discord Username অথবা ID দিন">

            <button id="orderBtn" onclick="submitOrder()" class="btn-ticket">NEXT: ORDER TICKET</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let selectedPkgIndex = null;
        let currentProduct = null;

        document.addEventListener('mousemove', e => {
            const glow = document.getElementById('mouse-glow');
            glow.style.setProperty('--x', e.clientX + 'px');
            glow.style.setProperty('--y', e.clientY + 'px');
        });

        // Load Video
        onValue(ref(db, 'settings/video_pc'), (s) => {
            if(s.exists()) {
                document.getElementById('videoSection').classList.remove('hidden');
                let url = s.val();
                if(url.includes('youtube.com/watch?v=')) url = url.replace('watch?v=', 'embed/');
                document.getElementById('videoFrame').innerHTML = `<iframe src="${url}" class="w-full aspect-video" frameborder="0" allowfullscreen></iframe>`;
            }
        });

        // Load Products
        onValue(ref(db, 'pc_panels'), (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(snapshot.exists()) {
                Object.keys(snapshot.val()).forEach(id => {
                    const p = snapshot.val()[id];
                    const div = document.createElement('div');
                    div.className = 'product-card';
                    div.innerHTML = `
                        <img src="${p.image}" class="product-image">
                        <h3 class="orbitron text-sm font-bold mb-4">${p.title}</h3>
                        <button onclick="openPurchaseModal('${id}')" class="btn-buy">Buy Now</button>
                    `;
                    grid.appendChild(div);
                });
            }
        });

        window.openPurchaseModal = (id) => {
            onValue(ref(db, `pc_panels/${id}`), (s) => {
                currentProduct = s.val();
                selectedPkgIndex = null;
                document.getElementById('modalProductTitle').innerText = currentProduct.title;
                const pkgList = document.getElementById('packageList');
                pkgList.innerHTML = '';
                currentProduct.packages.forEach((pkg, i) => {
                    const item = document.createElement('div');
                    item.className = 'package-item';
                    item.onclick = () => {
                        document.querySelectorAll('.package-item').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                        selectedPkgIndex = i;
                    };
                    item.innerHTML = `
                        <div class="package-info"><i class="far fa-clock"></i> <span>${pkg.duration}</span></div>
                        <div class="package-price">৳${pkg.sell_price} BDT</div>
                    `;
                    pkgList.appendChild(item);
                });
                document.getElementById('purchaseModal').style.display = 'flex';
            }, {onlyOnce: true});
        };

        window.closeModal = () => document.getElementById('purchaseModal').style.display = 'none';

        window.submitOrder = async function() {
            const discord = document.getElementById('discordUser').value.trim();
            const btn = document.getElementById('orderBtn');

            if(selectedPkgIndex === null) return alert("প্যাকেজ সিলেক্ট করুন!");
            if(!discord) return alert("ডিসকর্ড আইডি দিন!");

            const pkg = currentProduct.packages[selectedPkgIndex];
            btn.innerText = "SENDING...";
            btn.disabled = true;

            const details = `🛒 NEW ORDER\n👤 User: ${discord}\n📦 Product: ${currentProduct.title}\n⏳ Duration: ${pkg.duration}\n💰 Price: ৳${pkg.sell_price}`;

            try {
                // আমরা API-তে ডাটা পাঠাচ্ছি
                await fetch(`https://bangla-ff-bot-server.onrender.com/create-ticket`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: discord,
                        details: details
                    })
                });
                
                // সফল হলে বা রিকোয়েস্ট চলে গেলে সরাসরি ডিসকর্ড সার্ভারে নিয়ে যাবে
                alert("Ticket Request Sent! Redirecting to Discord...");
                window.location.href = "https://discord.gg/ZBjSWaF7u";
            } catch (err) {
                // যদি সার্ভার GET সাপোর্ট করে কিন্তু এরর দেয়, তাও আমরা ডিসকর্ডে পাঠিয়ে দেব
                window.location.href = `https://bangla-ff-bot-server.onrender.com/create-ticket?username=${encodeURIComponent(discord)}&details=${encodeURIComponent(details)}`;
            }
        };
    </script>
</body>
</html>
