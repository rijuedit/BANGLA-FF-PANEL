
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05020a">
    <title>BANGLA FF PANEL - PC PANEL</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #05020a;
            --card: #11071a;
            --border: #2a113d;
            --pink: #ff0066;
            --purple: #9d00ff;
            --green: #00e676;
            --text-gray: #b0b0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button, input {
            font: inherit;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
        }

        #mouse-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            left: -500px;
            top: -500px;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(157,0,255,.17),
                rgba(255,0,102,.05) 50%,
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .header {
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: rgba(12,5,20,.94);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,.05);
            border: 1px solid var(--border);
            border-radius: 9px;
            font-weight: 700;
            transition: .25s;
            white-space: nowrap;
        }

        .nav-btn:hover {
            border-color: var(--purple);
            background: rgba(157,0,255,.15);
            transform: translateY(-2px);
        }

        .discord-btn {
            color: #aeb7ff;
            border-color: #5865f2;
        }

        .discord-btn:hover {
            color: white;
            background: #5865f2;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            min-width: 0;
        }

        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--pink);
            object-fit: cover;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ff3b9b;
            background: linear-gradient(45deg,var(--pink),var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px 50px;
            position: relative;
            z-index: 1;
        }

        .page-header-title {
            text-align: center;
            font-size: clamp(1.5rem,4vw,2.3rem);
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-shadow: 0 0 18px rgba(157,0,255,.5);
        }

        .page-header-title i {
            color: var(--pink);
        }

        .page-subtitle {
            color: var(--text-gray);
            text-align: center;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
            gap: 24px;
        }

        .card {
            background: linear-gradient(145deg,#160923,#0d0613);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            overflow: hidden;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--pink);
            box-shadow: 0 10px 30px rgba(255,0,102,.15);
        }

        .card-img {
            width: 100%;
            height: 175px;
            object-fit: cover;
            border-radius: 11px;
            margin-bottom: 15px;
            background: #09040f;
            border: 1px solid rgba(255,255,255,.06);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .btn-buy {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg,var(--pink),var(--purple));
            color: white;
            font-weight: 900;
            letter-spacing: .7px;
            cursor: pointer;
            transition: .25s;
        }

        .btn-buy:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(157,0,255,.35);
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 45px 20px;
            color: var(--text-gray);
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 15px;
            line-height: 1.8;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 18px;
            background: rgba(0,0,0,.86);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal-box {
            position: relative;
            width: 100%;
            max-width: 480px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px;
            border: 1px solid var(--pink);
            border-radius: 20px;
            background: linear-gradient(145deg,#170a22,#09040f);
            box-shadow: 0 0 35px rgba(255,0,102,.2);
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: var(--pink);
        }

        .modal-header {
            text-align: center;
            margin: 10px 0 22px;
            padding: 0 15px;
        }

        .modal-title {
            color: #ff4a9e;
            font-size: 1.25rem;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .package-item {
            width: 100%;
            text-align: left;
            color: white;
            background: rgba(255,255,255,.035);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .package-item:hover,
        .package-item.selected {
            border-color: var(--pink);
            background: rgba(255,0,102,.12);
        }

        .pkg-duration {
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .pkg-price-box {
            text-align: right;
            flex-shrink: 0;
        }

        .pkg-old-price {
            text-decoration: line-through;
            color: #888;
            font-size: .8rem;
            margin-right: 5px;
        }

        .pkg-sell-price {
            color: var(--green);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .user-id-step {
            display: none;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 9px;
            font-size: .95rem;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            color: white;
            background: #080312;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 10px rgba(255,0,102,.15);
        }

        .id-help-text {
            color: #aaa;
            font-size: .8rem;
            line-height: 1.7;
            margin-top: 9px;
        }

        .btn-modal-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(45deg,#00cc66,#00ff88);
            color: #06140b;
            font-weight: 900;
            cursor: pointer;
            transition: .2s;
        }

        .btn-modal-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(0,230,118,.2);
        }

        .btn-modal-action:disabled {
            background: #383838;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            margin-top: 10px;
            background: #21152b;
            color: white;
            border: 1px solid var(--border);
        }

        .status-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            line-height: 1.7;
            font-size: .9rem;
            overflow-wrap: anywhere;
        }

        .status-error {
            display: block;
            color: #ffb7c8;
            border: 1px solid rgba(255,0,102,.35);
            background: rgba(255,0,102,.08);
        }

        .status-info {
            display: block;
            color: #b8f7d4;
            border: 1px solid rgba(0,230,118,.25);
            background: rgba(0,230,118,.06);
        }

        @media (max-width: 600px) {
            .header {
                padding: 12px 4%;
                gap: 8px;
            }

            .header-left {
                gap: 8px;
            }

            .logo-text,
            .nav-btn span {
                display: none;
            }

            .nav-btn {
                padding: 10px 12px;
            }

            .logo-img {
                width: 38px;
                height: 38px;
            }

            .container {
                margin-top: 30px;
                padding: 0 14px 35px;
            }

            .grid-container {
                grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
                gap: 15px;
            }

            .card {
                padding: 13px;
            }

            .card-img {
                height: 145px;
            }

            .modal-box {
                padding: 24px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="mouse-glow" aria-hidden="true"></div>

    <header class="header">
        <div class="header-left">
            <a href="index.html" class="nav-btn" aria-label="Back to home">
                <i class="fa-solid fa-arrow-left"></i>
                <span>BACK</span>
            </a>

            <a href="index.html" class="logo-box">
                <img
                    src="logo.png"
                    alt="BANGLA FF PANEL Logo"
                    class="logo-img"
                    onerror="this.onerror=null;this.src='https://via.placeholder.com/42/ff0066/ffffff?text=BR';"
                >
                <span class="logo-text">BANGLA FF PANEL</span>
            </a>
        </div>

        <a
            href="https://discord.gg/ZBjSWaF7u"
            class="nav-btn discord-btn dynamic-discord"
            target="_blank"
            rel="noopener noreferrer"
        >
            <i class="fa-brands fa-discord"></i>
            <span>DISCORD</span>
        </a>
    </header>

    <main class="container">
        <h1 class="page-header-title">
            <i class="fa-solid fa-desktop"></i>
            PC PANEL PREMIUM
        </h1>

        <p class="page-subtitle">
            আপনার পছন্দের PC Panel নির্বাচন করুন এবং অর্ডার করুন।
        </p>

        <div class="grid-container" id="pc-grid">
            <div class="no-data">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Products Loading...
            </div>
        </div>
    </main>

    <!-- Purchase Modal -->
    <div
        class="modal-overlay"
        id="purchaseModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalProductName"
    >
        <div class="modal-box">
            <button
                class="modal-close"
                id="closeModal"
                type="button"
                aria-label="Close"
            >&times;</button>

            <!-- Step 1: Select Package -->
            <section id="step-packages">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalProductName">
                        SELECT PACKAGE
                    </h2>
                </div>

                <div class="package-list" id="packageContainer"></div>

                <button class="btn-modal-action" id="btnNextStep" type="button">
                    NEXT: ORDER TICKET
                </button>
            </section>

            <!-- Step 2: Discord User ID -->
            <section class="user-id-step" id="step-user-id">
                <div class="modal-header">
                    <h2 class="modal-title">CUSTOMER DETAILS</h2>
                </div>

                <div class="input-group">
                    <label for="discordIdInput">
                        <i class="fa-brands fa-discord"></i>
                        আপনার Discord User ID লিখুন
                    </label>

                    <input
                        type="text"
                        id="discordIdInput"
                        placeholder="যেমন: 123456789012345678"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="20"
                    >

                    <p class="id-help-text">
                        আপনার Discord User ID শুধু সংখ্যায় লিখুন।
                        Username নয়। অর্ডার করার আগে আমাদের Discord Server-এ
                        Join করা থাকতে হবে।
                    </p>
                </div>

                <button
                    class="btn-modal-action"
                    id="btnConfirmOrder"
                    type="button"
                >
                    <i class="fa-brands fa-discord"></i>
                    CREATE PRIVATE TICKET
                </button>

                <button
                    class="btn-modal-action btn-secondary"
                    id="btnBackPackages"
                    type="button"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    BACK TO PACKAGES
                </button>

                <div
                    id="orderStatus"
                    class="status-message"
                    role="status"
                    aria-live="polite"
                ></div>
            </section>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            get
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ================= FIREBASE CONFIG =================

        const firebaseConfig = {
            apiKey: "AIzaSyDOFL6dKvw_RfyKMe3QQgvE4lt7Gtc4yaM",
            authDomain: "bangla-ff-admin.firebaseapp.com",
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangla-ff-admin",
            storageBucket: "bangla-ff-admin.firebasestorage.app",
            messagingSenderId: "295013484465",
            appId: "1:295013484465:web:b6bc2a949e239095761f90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ================= BOT CONFIG =================

        const BOT_SERVER_URL =
            "https://bangla-ff-bot-server.onrender.com";

        const DEFAULT_DISCORD_LINK =
            "https://discord.gg/ZBjSWaF7u";

        // ================= ELEMENTS =================

        const pcGrid = document.getElementById("pc-grid");
        const purchaseModal = document.getElementById("purchaseModal");
        const closeModal = document.getElementById("closeModal");

        const modalProductName =
            document.getElementById("modalProductName");

        const packageContainer =
            document.getElementById("packageContainer");

        const stepPackages =
            document.getElementById("step-packages");

        const stepUserId =
            document.getElementById("step-user-id");

        const btnNextStep =
            document.getElementById("btnNextStep");

        const btnBackPackages =
            document.getElementById("btnBackPackages");

        const btnConfirmOrder =
            document.getElementById("btnConfirmOrder");

        const discordIdInput =
            document.getElementById("discordIdInput");

        const orderStatus =
            document.getElementById("orderStatus");

        // ================= STATE =================

        let selectedProductTitle = "";
        let selectedPackageData = null;
        let activeProductKey = null;
        let isSubmitting = false;

        // ================= HELPERS =================

        function showStatus(message, type = "error") {
            orderStatus.textContent = message;
            orderStatus.className =
                "status-message " +
                (type === "info" ? "status-info" : "status-error");
        }

        function clearStatus() {
            orderStatus.textContent = "";
            orderStatus.className = "status-message";
        }

        function setSubmitLoading(loading) {
            isSubmitting = loading;
            btnConfirmOrder.disabled = loading;
            btnBackPackages.disabled = loading;

            btnConfirmOrder.innerHTML = loading
                ? '<i class="fa-solid fa-spinner fa-spin"></i> CREATING TICKET...'
                : '<i class="fa-brands fa-discord"></i> CREATE PRIVATE TICKET';
        }

        function closeOrderModal() {
            if (isSubmitting) return;

            purchaseModal.style.display = "none";
            clearStatus();
        }

        function openOrderStep(step) {
            stepPackages.style.display =
                step === "packages" ? "block" : "none";

            stepUserId.style.display =
                step === "user" ? "block" : "none";

            if (step === "user") {
                discordIdInput.focus();
            }
        }

        function safeText(value, fallback = "") {
            if (value === undefined || value === null) {
                return fallback;
            }

            return String(value);
        }

        function formatPrice(value) {
            if (value === undefined || value === null || value === "") {
                return "Price unavailable";
            }

            return `${value} BDT`;
        }

        // ================= DYNAMIC DISCORD LINK =================

        onValue(
            ref(db, "global_settings/discord_link"),
            (snapshot) => {
                const link = snapshot.val() || DEFAULT_DISCORD_LINK;

                document
                    .querySelectorAll(".dynamic-discord")
                    .forEach((button) => {
                        button.href = link;
                    });
            },
            (error) => {
                console.error("Discord link loading error:", error);
            }
        );

        // ================= LOAD PC PRODUCTS =================

        onValue(
            ref(db, "pc_panels"),
            (snapshot) => {
                pcGrid.innerHTML = "";

                if (!snapshot.exists()) {
                    pcGrid.innerHTML = `
                        <div class="no-data">
                            <i class="fa-solid fa-folder-open"></i>
                            <p>No Products Available.</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const itemKey = childSnapshot.key;
                    const item = childSnapshot.val() || {};

                    const card = document.createElement("article");
                    card.className = "card";

                    const image = document.createElement("img");
                    image.className = "card-img";
                    image.loading = "lazy";
                    image.alt = safeText(item.title, "PC Panel");
                    image.src = item.image ||
                        "https://via.placeholder.com/300x170/11071a/ff0066?text=PC+PANEL";

                    image.onerror = () => {
                        image.onerror = null;
                        image.src =
                            "https://via.placeholder.com/300x170/11071a/ff0066?text=PC+PANEL";
                    };

                    const title = document.createElement("h3");
                    title.className = "card-title";
                    title.textContent = safeText(item.title, "PC Panel");

                    const details = document.createElement("div");
                    details.append(image, title);

                    const buyButton = document.createElement("button");
                    buyButton.className = "btn-buy";
                    buyButton.type = "button";
                    buyButton.innerHTML =
                        '<i class="fa-solid fa-cart-shopping"></i> BUY NOW';

                    buyButton.addEventListener("click", () => {
                        openOrderModal(itemKey);
                    });

                    card.append(details, buyButton);
                    pcGrid.appendChild(card);
                });
            },
            (error) => {
                console.error("Product loading error:", error);

                pcGrid.innerHTML = `
                    <div class="no-data">
                        Products load করা যায়নি। Firebase Database
                        connection ও permission চেক করুন।
                    </div>
                `;
            }
        );

        // ================= OPEN ORDER MODAL =================

        async function openOrderModal(itemKey) {
            try {
                const snapshot = await get(
                    ref(db, `pc_panels/${itemKey}`)
                );

                if (!snapshot.exists()) {
                    alert("এই Product আর পাওয়া যাচ্ছে না।");
                    return;
                }

                const data = snapshot.val() || {};

                activeProductKey = itemKey;
                selectedProductTitle = safeText(data.title, "PC Panel");
                selectedPackageData = null;

                modalProductName.textContent = selectedProductTitle;
                packageContainer.innerHTML = "";

                const packages = Array.isArray(data.packages)
                    ? data.packages
                    : Object.values(data.packages || {});

                if (packages.length === 0) {
                    packageContainer.innerHTML = `
                        <div class="no-data">
                            এই Product-এর কোনো Package সেট করা নেই।
                        </div>
                    `;
                } else {
                    packages.forEach((pkg, index) => {
                        if (!pkg) return;

                        const packageButton =
                            document.createElement("button");

                        packageButton.type = "button";
                        packageButton.className = "package-item";

                        const duration = document.createElement("span");
                        duration.className = "pkg-duration";
                        duration.textContent =
                            safeText(pkg.duration, "Package");

                        const priceBox = document.createElement("span");
                        priceBox.className = "pkg-price-box";

                        if (
                            pkg.old_price !== undefined &&
                            pkg.old_price !== null &&
                            pkg.old_price !== ""
                        ) {
                            const oldPrice = document.createElement("span");
                            oldPrice.className = "pkg-old-price";
                            oldPrice.textContent = safeText(pkg.old_price);
                            priceBox.appendChild(oldPrice);
                        }

                        const sellPrice = document.createElement("span");
                        sellPrice.className = "pkg-sell-price";
                        sellPrice.textContent = formatPrice(pkg.sell_price);

                        priceBox.appendChild(sellPrice);
                        packageButton.append(duration, priceBox);

                        packageButton.addEventListener("click", () => {
                            document
                                .querySelectorAll(".package-item")
                                .forEach((element) => {
                                    element.classList.remove("selected");
                                });

                            packageButton.classList.add("selected");

                            selectedPackageData = {
                                ...pkg,
                                packageIndex: index
                            };

                            clearStatus();
                        });

                        packageContainer.appendChild(packageButton);
                    });
                }

                discordIdInput.value = "";
                clearStatus();
                openOrderStep("packages");
                purchaseModal.style.display = "flex";
            } catch (error) {
                console.error("Could not open product:", error);
                alert("Product খুলতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
            }
        }

        // ================= NEXT STEP =================

        btnNextStep.addEventListener("click", () => {
            if (!selectedPackageData) {
                alert("দয়া করে যেকোনো একটি Package সিলেক্ট করুন!");
                return;
            }

            if (
                selectedPackageData.sell_price === undefined ||
                selectedPackageData.sell_price === null ||
                selectedPackageData.sell_price === ""
            ) {
                alert("এই Package-এর Price সেট করা নেই।");
                return;
            }

            clearStatus();
            openOrderStep("user");
        });

        // ================= BACK TO PACKAGES =================

        btnBackPackages.addEventListener("click", () => {
            if (isSubmitting) return;

            clearStatus();
            openOrderStep("packages");
        });

        // ================= CREATE DISCORD TICKET =================

        btnConfirmOrder.addEventListener("click", async () => {
            if (isSubmitting) return;

            const userInputId = discordIdInput.value.trim();

            if (!selectedProductTitle || !selectedPackageData) {
                showStatus("আগে Product এবং Package নির্বাচন করুন।");
                openOrderStep("packages");
                return;
            }

            // Discord IDs are numeric snowflakes, not usernames
            if (!/^\d{17,20}$/.test(userInputId)) {
                showStatus(
                    "সঠিক Numeric Discord User ID দিন। Username বা সাধারণ নাম দেওয়া যাবে না।"
                );
                discordIdInput.focus();
                return;
            }

            setSubmitLoading(true);
            showStatus("আপনার Discord Ticket তৈরি হচ্ছে। অপেক্ষা করুন...", "info");

            try {
                const response = await fetch(
                    `${BOT_SERVER_URL}/create-ticket`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            discordUserId: userInputId,
                            productTitle: selectedProductTitle,
                            packageName: safeText(
                                selectedPackageData.duration,
                                "N/A"
                            ),
                            price: selectedPackageData.sell_price
                        })
                    }
                );

                let result;

                try {
                    result = await response.json();
                } catch {
                    throw new Error(
                        "Bot Server থেকে সঠিক Response পাওয়া যায়নি।"
                    );
                }

                if (
                    response.ok &&
                    result.success === true &&
                    typeof result.url === "string" &&
                    result.url.startsWith("https://discord.com/channels/")
                ) {
                    showStatus(
                        "Ticket তৈরি হয়েছে! Discord-এ নেওয়া হচ্ছে...",
                        "info"
                    );

                    window.location.assign(result.url);
                    return;
                }

                if (result.error === "JOIN_SERVER_FIRST") {
                    showStatus(
                        "তুমি এখনো আমাদের Discord Server-এর Member নও। " +
                        "প্রথমে উপরের DISCORD বাটনে ক্লিক করে Server-এ Join করো। " +
                        "তারপর আবার Website-এ এসে Order করো।"
                    );
                    return;
                }

                if (result.error === "INVALID_DISCORD_ID") {
                    showStatus(
                        "Discord User ID সঠিক নয়। Numeric User ID আবার চেক করো।"
                    );
                    return;
                }

                if (result.error === "MISSING_ORDER_DETAILS") {
                    showStatus(
                        "Order-এর তথ্য অসম্পূর্ণ। Package আবার নির্বাচন করে চেষ্টা করো।"
                    );
                    return;
                }

                if (response.status === 503) {
                    showStatus(
                        "Bot এখন চালু হচ্ছে। কিছুক্ষণ পর আবার চেষ্টা করো।"
                    );
                    return;
                }

                console.error("Ticket API error:", response.status, result);

                showStatus(
                    "Ticket তৈরি করা যায়নি। Bot Server, Category ID এবং Bot Permissions চেক করে আবার চেষ্টা করো।"
                );
            } catch (error) {
                console.error("Bot connection error:", error);

                showStatus(
                    "Bot Server-এর সঙ্গে সংযোগ করা যাচ্ছে না। " +
                    "Render-এ Bot চালু আছে কি না দেখো এবং কিছুক্ষণ পর আবার চেষ্টা করো।"
                );
            } finally {
                setSubmitLoading(false);
            }
        });

        // ================= CLOSE MODAL =================

        closeModal.addEventListener("click", closeOrderModal);

        purchaseModal.addEventListener("click", (event) => {
            if (event.target === purchaseModal) {
                closeOrderModal();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "Escape" &&
                purchaseModal.style.display === "flex"
            ) {
                closeOrderModal();
            }
        });

        // ================= MOUSE GLOW EFFECT =================

        const mouseGlow = document.getElementById("mouse-glow");

        document.addEventListener("mousemove", (event) => {
            mouseGlow.style.left = `${event.clientX}px`;
            mouseGlow.style.top = `${event.clientY}px`;
        });

        // Keep the current product key available for future enhancements.
        void activeProductKey;
    </script>
</body>
</html>
