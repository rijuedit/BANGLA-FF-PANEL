<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC PANEL PREMIUM - BANGLA FF PANEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #07030b;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- Premium Navbar ----- */
        .navbar {
            background: #0d0614;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a113d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-back {
            background: transparent;
            color: #ffffff;
            border: 1px solid #2a113d;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-back:hover {
            background: #1a0b2e;
            border-color: #ff007f;
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-discord {
            background: transparent;
            color: #5865F2;
            border: 1px solid #5865F2;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-discord:hover {
            background: #5865F2;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ----- Video Section ----- */
        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 40px auto;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a113d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 16/9;
            background: #11071a;
            display: none; /* Hidden until data loads */
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: 0.3s;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff007f;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            border: none;
            z-index: 2;
            transition: 0.3s;
        }
        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.9);
        }

        .video-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 3;
        }

        /* ----- Title ----- */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 40px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }
        .section-title i {
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        /* ----- Product Grid ----- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: #11071a;
            border: 1px solid #2a113d;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
            position: relative;
        }

        .card:hover {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.2);
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 170px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #2a113d;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .btn-buy {
            background: linear-gradient(90deg, #d500f9, #ff007f);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: auto;
            transition: 0.3s;
        }

        .btn-buy:hover {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transform: scale(1.02);
        }

        /* ----- Modal (Strictly As Requested) ----- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-box {
            background: #0d0614;
            width: 90%;
            max-width: 450px;
            border: 2px solid #ff007f;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-close:hover { color: #ff007f; }

        .modal-title {
            text-align: center;
            color: #ff007f;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,127,0.4);
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .pkg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #150a21;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a113d;
            cursor: pointer;
            transition: 0.3s;
        }

        .pkg-item:hover, .pkg-item.selected {
            border-color: #ff007f;
            background: #1c0d2e;
        }

        .pkg-duration {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .pkg-prices {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pkg-old {
            color: #666;
            text-decoration: line-through;
            font-size: 0.85rem;
        }

        .pkg-new {
            color: #00ff7f; /* Neon Green */
            font-weight: 800;
            font-size: 1.1rem;
        }

        .btn-next {
            background: #00ff7f;
            color: #000;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-next:hover {
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: #ff007f;
            grid-column: 1/-1;
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- Premium Navbar -->
    <nav class="navbar">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> BACK</a>
        <div class="nav-logo">BANGLA FF PANEL</div>
        <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> DISCORD
        </a>
    </nav>

    <div class="container">
        
        <!-- Premium Video Section -->
        <div class="video-container" id="videoContainer">
            <img src="https://via.placeholder.com/800x450/11071a/ff007f?text=Loading+Thumbnail..." id="vidThumb" class="video-thumbnail" alt="Video Thumbnail">
            <button class="play-btn" onclick="playVideo()"><i class="fas fa-play"></i></button>
            <iframe id="vidIframe" class="video-iframe" allowfullscreen></iframe>
        </div>

        <!-- Section Title -->
        <h2 class="section-title">
            <i class="fas fa-desktop"></i> PC PANEL PREMIUM
        </h2>

        <!-- Product Grid -->
        <div class="grid" id="productGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Premium Panels...</div>
        </div>

    </div>

    <!-- Purchase Modal -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <h3 class="modal-title" id="mTitle">PRODUCT NAME</h3>
            
            <div class="pkg-list" id="pkgList">
                <!-- Packages will be injected here dynamically -->
            </div>

            <button class="btn-next" id="btnNext" onclick="proceedToTicket()">NEXT: ORDER TICKET</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let productsData = {};
        let selectedProduct = null;
        let selectedPackageInfo = null;

        // Fetch Setup Video
        database.ref('settings/video_pc').on('value', snap => {
            const url = snap.val();
            const container = document.getElementById('videoContainer');
            const iframe = document.getElementById('vidIframe');
            const thumb = document.getElementById('vidThumb');

            if (url) {
                container.style.display = 'block';
                let embedUrl = url;
                let thumbUrl = 'https://via.placeholder.com/800x450/11071a/ff007f?text=PC+Setup+Tutorial';

                // Extract Youtube Thumbnail
                if (url.includes('youtube.com/watch?v=')) {
                    let videoId = url.split('v=')[1].substring(0, 11);
                    embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                } else if (url.includes('youtu.be/')) {
                    let videoId = url.split('youtu.be/')[1].substring(0, 11);
                    embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                } else if (url.includes('drive.google.com')) {
                    embedUrl = url.replace('/view', '/preview');
                }

                thumb.src = thumbUrl;
                iframe.src = embedUrl;
            } else {
                container.style.display = 'none';
            }
        });

        function playVideo() {
            document.getElementById('vidThumb').style.display = 'none';
            document.querySelector('.play-btn').style.display = 'none';
            document.getElementById('vidIframe').style.display = 'block';
        }

        // Fetch PC Products
        database.ref('pc_panels').on('value', snap => {
            productsData = snap.val() || {};
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (Object.keys(productsData).length === 0) {
                grid.innerHTML = '<div class="loading">No panels available right now.</div>';
                return;
            }

            Object.keys(productsData).forEach(key => {
                const item = productsData[key];
                
                // HTML strict as per screenshot. No N/A, just clean info.
                const card = `
                    <div class="card">
                        <img src="${item.image || 'https://via.placeholder.com/300x170/1a0b2e/ff007f?text=Premium+Panel'}" class="card-img" alt="Panel">
                        <h3 class="card-title">${item.name || 'Premium Panel'}</h3>
                        <button class="btn-buy" onclick="openModal('${key}')">
                            <i class="fas fa-shopping-cart"></i> BUY NOW
                        </button>
                    </div>
                `;
                grid.innerHTML += card;
            });
        });

        // Modal Functionality
        function openModal(key) {
            selectedProduct = productsData[key];
            document.getElementById('mTitle').innerText = selectedProduct.name;
            const pkgList = document.getElementById('pkgList');
            pkgList.innerHTML = '';
            selectedPackageInfo = null;

            let pkgs = selectedProduct.packages || {};
            let hasPackages = Object.keys(pkgs).length > 0;

            if (hasPackages) {
                Object.keys(pkgs).forEach((pkgName, index) => {
                    const price = pkgs[pkgName];
                    // Using oldPrice algorithm if set, else simple visual cut
                    let oldP = selectedProduct.oldPrice ? (parseInt(price) + parseInt(selectedProduct.oldPrice - selectedProduct.salePrice)) : parseInt(price) + 300;
                    
                    pkgList.innerHTML += `
                        <div class="pkg-item ${index === 0 ? 'selected' : ''}" onclick="selectPackage(this, '${pkgName}', '${price}')">
                            <span class="pkg-duration">${pkgName}</span>
                            <div class="pkg-prices">
                                <span class="pkg-old">${oldP}</span>
                                <span class="pkg-new">${price}</span>
                            </div>
                        </div>
                    `;
                    // auto select first
                    if (index === 0) selectedPackageInfo = { duration: pkgName, price: price };
                });
            } else {
                // Default fallback if admin didn't set packages
                const sPrice = selectedProduct.salePrice || selectedProduct.price || '0';
                const oPrice = selectedProduct.oldPrice || (parseInt(sPrice) + 400);
                pkgList.innerHTML = `
                    <div class="pkg-item selected" onclick="selectPackage(this, 'Standard License', '${sPrice}')">
                        <span class="pkg-duration">Standard License</span>
                        <div class="pkg-prices">
                            <span class="pkg-old">${oPrice}</span>
                            <span class="pkg-new">${sPrice}</span>
                        </div>
                    </div>
                `;
                selectedPackageInfo = { duration: 'Standard License', price: sPrice };
            }

            document.getElementById('purchaseModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
        }

        function selectPackage(el, duration, price) {
            document.querySelectorAll('.pkg-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedPackageInfo = { duration, price };
        }

        // Proceed to Ticket (Webhook payload)
        function proceedToTicket() {
            if (!selectedPackageInfo) {
                alert("Please select a package.");
                return;
            }
            
            const btn = document.getElementById('btnNext');
            btn.innerText = 'PROCESSING...';
            btn.style.opacity = '0.7';

            const payload = {
                type: 'PC Panel Order Request',
                productName: selectedProduct.name,
                package: selectedPackageInfo.duration,
                price: selectedPackageInfo.price,
                timestamp: new Date().toISOString()
            };

            // Send to Discord bot silently
            fetch('https://bangla-ff-bot-server.onrender.com/send-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert('Request processing started! Please check Discord / Create a ticket on Discord server to complete the payment.');
                closeModal();
                btn.innerText = 'NEXT: ORDER TICKET';
                btn.style.opacity = '1';
                window.open("https://discord.gg/ZBjSWaF7u", "_blank"); // Take them to discord
            }).catch(() => {
                alert('Taking you to Discord to complete the order...');
                closeModal();
                btn.innerText = 'NEXT: ORDER TICKET';
                btn.style.opacity = '1';
                window.open("https://discord.gg/ZBjSWaF7u", "_blank");
            });
        }
    </script>
</body>
</html>
