<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC PANEL PREMIUM - BANGLA FF PANEL</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #07030b;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ----- Navbar ----- */
        .navbar {
            background: #0d0614;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a113d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-back {
            background: #140821;
            color: #ffffff;
            border: 1px solid #2a113d;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            background: #1a0b2e;
            border-color: #ff007f;
            color: #ff007f;
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff007f;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.7);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-discord {
            background: #140821;
            color: #5865F2;
            border: 1px solid #5865F2;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-discord:hover {
            background: #5865F2;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ----- Video Section (Auto Hidden if Empty) ----- */
        .video-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 35px auto;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a113d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            aspect-ratio: 16/9;
            background: #11071a;
            display: none;
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff007f;
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
            border: none;
            z-index: 2;
            transition: 0.3s;
        }

        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 35px rgba(255, 0, 127, 1);
        }

        .video-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 3;
        }

        /* ----- Section Title ----- */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 35px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .section-title i {
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        /* ----- Product Grid ----- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: #0e0617;
            border: 1.5px solid #2a113d;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 175px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
            border: 1px solid #2a113d;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .btn-buy {
            background: linear-gradient(90deg, #d500f9, #ff007f);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: auto;
            transition: 0.3s;
        }

        .btn-buy:hover {
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
            transform: scale(1.02);
        }

        /* ----- Two-Step Purchase Modal ----- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-box {
            background: #0d0614;
            width: 100%;
            max-width: 440px;
            border: 2px solid #ff007f;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.35);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-close:hover { color: #ff007f; }

        .modal-title {
            text-align: center;
            color: #ff007f;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 22px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,127,0.4);
        }

        /* Step 1: Packages List */
        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
            max-height: 280px;
            overflow-y: auto;
        }

        .pkg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #140921;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2a113d;
            cursor: pointer;
            transition: 0.3s;
        }

        .pkg-item:hover, .pkg-item.selected {
            border-color: #ff007f;
            background: #1e0b33;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .pkg-duration {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .pkg-prices {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pkg-old {
            color: #777777;
            text-decoration: line-through;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .pkg-new {
            color: #00ff7f; /* Bright Neon Green */
            font-weight: 800;
            font-size: 1.15rem;
        }

        /* Step 2: Customer Details Form */
        .form-group-custom {
            margin-bottom: 20px;
        }

        .form-label-custom {
            display: block;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-input-custom {
            width: 100%;
            background: #180a29;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-input-custom:focus {
            border-color: #ff007f;
        }

        .form-subtext-custom {
            display: block;
            font-size: 0.78rem;
            color: #888888;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Neon Action Buttons */
        .btn-neon {
            background: #00ff7f;
            color: #000000;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-neon:hover {
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.6);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: #ff007f;
            grid-column: 1/-1;
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> BACK</a>
        <div class="nav-logo">BANGLA FF PANEL</div>
        <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> DISCORD
        </a>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
        
        <!-- Video Tutorial Section (Auto-Hidden if Empty) -->
        <div class="video-container" id="videoContainer">
            <img src="https://via.placeholder.com/800x450/11071a/ff007f?text=Loading+Thumbnail..." id="vidThumb" class="video-thumbnail" alt="Video Tutorial">
            <button class="play-btn" onclick="playVideo()"><i class="fas fa-play"></i></button>
            <iframe id="vidIframe" class="video-iframe" allowfullscreen></iframe>
        </div>

        <!-- Section Title -->
        <h2 class="section-title">
            <i class="fas fa-desktop"></i> PC PANEL PREMIUM
        </h2>

        <!-- Product Grid -->
        <div class="grid" id="productGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Products...</div>
        </div>

    </div>

    <!-- Purchase Modal (Two-Step Flow) -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            
            <!-- STEP 1 VIEW: Package Selection -->
            <div id="step1View">
                <h3 class="modal-title" id="mTitleStep1">PRODUCT NAME</h3>
                <div class="pkg-list" id="pkgList">
                    <!-- Dynamic Packages -->
                </div>
                <button class="btn-neon" onclick="goToStep2()">NEXT: ORDER TICKET</button>
            </div>

            <!-- STEP 2 VIEW: Customer Details -->
            <div id="step2View" style="display: none;">
                <h3 class="modal-title">CUSTOMER DETAILS</h3>
                <div class="form-group-custom">
                    <label class="form-label-custom">👤 আপনার নাম লিখুন:</label>
                    <input type="text" id="userNameInput" class="form-input-custom" placeholder="এখানে আপনার নাম লিখুন..." required>
                    <span class="form-subtext-custom">(আপনার ডিসকর্ড ইউজারনেম বা সাধারণ নাম দিতে পারেন)</span>
                </div>
                <button class="btn-neon" id="btnSubmitTicket" onclick="submitDiscordTicket()">PROCEED TO DISCORD TICKET</button>
            </div>

        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let productsData = {};
        let selectedProduct = null;
        let selectedPackageInfo = null;

        // Fetch Setup Video Setting
        database.ref('settings/video_pc').on('value', snap => {
            const url = snap.val();
            const container = document.getElementById('videoContainer');
            const iframe = document.getElementById('vidIframe');
            const thumb = document.getElementById('vidThumb');

            if (url && url.trim() !== '') {
                container.style.display = 'block';
                let embedUrl = url;
                let thumbUrl = 'https://via.placeholder.com/800x450/11071a/ff007f?text=PC+Panel+Setup+Tutorial';

                if (url.includes('youtube.com/watch?v=')) {
                    let vId = url.split('v=')[1].substring(0, 11);
                    embedUrl = `https://www.youtube.com/embed/${vId}?autoplay=1`;
                    thumbUrl = `https://img.youtube.com/vi/${vId}/maxresdefault.jpg`;
                } else if (url.includes('youtu.be/')) {
                    let vId = url.split('youtu.be/')[1].substring(0, 11);
                    embedUrl = `https://www.youtube.com/embed/${vId}?autoplay=1`;
                    thumbUrl = `https://img.youtube.com/vi/${vId}/maxresdefault.jpg`;
                } else if (url.includes('drive.google.com')) {
                    embedUrl = url.replace('/view', '/preview');
                }

                thumb.src = thumbUrl;
                iframe.src = embedUrl;
            } else {
                container.style.display = 'none';
            }
        });

        function playVideo() {
            document.getElementById('vidThumb').style.display = 'none';
            document.querySelector('.play-btn').style.display = 'none';
            document.getElementById('vidIframe').style.display = 'block';
        }

        // Fetch Products from RTDB 'pc_panels'
        database.ref('pc_panels').on('value', snap => {
            productsData = snap.val() || {};
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const keys = Object.keys(productsData);
            if (keys.length === 0) {
                grid.innerHTML = '<div class="loading">No PC Panels available at the moment.</div>';
                return;
            }

            keys.forEach(key => {
                const item = productsData[key];
                const pName = item.name || item.title || item.productName || 'PC PANEL';
                const pImg = item.image || item.img || 'https://via.placeholder.com/300x175/11071a/ff007f?text=PC+Panel';

                const cardHTML = `
                    <div class="card">
                        <img src="${pImg}" class="card-img" alt="${pName}" onerror="this.src='https://via.placeholder.com/300x175/11071a/ff007f?text=No+Image'">
                        <h3 class="card-title">${pName}</h3>
                        <button class="btn-buy" onclick="openModal('${key}')">
                            <i class="fas fa-shopping-cart"></i> BUY NOW
                        </button>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        });

        // Open Modal - Step 1
        function openModal(key) {
            selectedProduct = productsData[key];
            if (!selectedProduct) return;

            const pName = selectedProduct.name || selectedProduct.title || selectedProduct.productName || 'BASIC PANEL';
            document.getElementById('mTitleStep1').innerText = pName;
            
            const pkgList = document.getElementById('pkgList');
            pkgList.innerHTML = '';
            selectedPackageInfo = null;

            // Reset Views
            document.getElementById('step1View').style.display = 'block';
            document.getElementById('step2View').style.display = 'none';
            document.getElementById('userNameInput').value = '';

            let packages = selectedProduct.packages || selectedProduct.package || selectedProduct.prices || {};
            let parsedPackages = [];

            // Smart Parser for package entries to prevent [object Object]
            if (typeof packages === 'object' && packages !== null) {
                Object.keys(packages).forEach(pkgKey => {
                    let val = packages[pkgKey];
                    if (typeof val === 'object' && val !== null) {
                        parsedPackages.push({
                            name: val.name || pkgKey,
                            oldPrice: val.oldPrice || val.old || '',
                            price: val.price || val.salePrice || val.amount || 0
                        });
                    } else {
                        // Estimate nice crossed oldPrice matching screenshot ratios if not explicit
                        let numericSale = parseInt(val) || 0;
                        let defaultOld = numericSale > 0 ? Math.round(numericSale * 1.25 / 5) * 5 : '';
                        
                        parsedPackages.push({
                            name: pkgKey,
                            oldPrice: selectedProduct.oldPrice || defaultOld,
                            price: val
                        });
                    }
                });
            }

            // Fallback if no packages exist
            if (parsedPackages.length === 0) {
                const sPrice = selectedProduct.salePrice || selectedProduct.price || '0';
                const oPrice = selectedProduct.oldPrice || '';
                parsedPackages.push({
                    name: 'Standard License',
                    oldPrice: oPrice,
                    price: sPrice
                });
            }

            // Render Package items (Strictly like Screenshot #1)
            parsedPackages.forEach((pkg, index) => {
                const isSelected = index === 0;
                let oldPriceHTML = pkg.oldPrice ? `<span class="pkg-old">${pkg.oldPrice}</span>` : '';
                
                const itemHTML = `
                    <div class="pkg-item ${isSelected ? 'selected' : ''}" onclick="selectPackage(this, '${pkg.name}', '${pkg.price}')">
                        <span class="pkg-duration">${pkg.name}</span>
                        <div class="pkg-prices">
                            ${oldPriceHTML}
                            <span class="pkg-new">${pkg.price}</span>
                        </div>
                    </div>
                `;
                pkgList.innerHTML += itemHTML;

                if (isSelected) {
                    selectedPackageInfo = { duration: pkg.name, price: pkg.price };
                }
            });

            document.getElementById('purchaseModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
        }

        function selectPackage(el, duration, price) {
            document.querySelectorAll('.pkg-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedPackageInfo = { duration, price };
        }

        // Switch to Step 2
        function goToStep2() {
            if (!selectedPackageInfo) {
                alert("দয়া করে একটি প্যাকেজ সিলেক্ট করুন!");
                return;
            }
            document.getElementById('step1View').style.display = 'none';
            document.getElementById('step2View').style.display = 'block';
        }

        // Submit Discord Ticket
        function submitDiscordTicket() {
            const userName = document.getElementById('userNameInput').value.trim();
            if (!userName) {
                alert("দয়া করে আপনার নাম বা ডিসকর্ড ইউজারনেম লিখুন!");
                return;
            }

            const btn = document.getElementById('btnSubmitTicket');
            btn.innerText = 'PROCESSING...';
            btn.style.opacity = '0.7';

            const payload = {
                type: 'PC Panel Order Request',
                productName: selectedProduct.name || selectedProduct.title || 'PC Panel',
                package: selectedPackageInfo.duration,
                price: selectedPackageInfo.price,
                userName: userName,
                timestamp: new Date().toISOString()
            };

            // Send payload to Render bot server
            fetch('https://bangla-ff-bot-server.onrender.com/send-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                closeModal();
                btn.innerText = 'PROCEED TO DISCORD TICKET';
                btn.style.opacity = '1';
                window.open("https://discord.gg/ZBjSWaF7u", "_blank");
            }).catch(() => {
                closeModal();
                btn.innerText = 'PROCEED TO DISCORD TICKET';
                btn.style.opacity = '1';
                window.open("https://discord.gg/ZBjSWaF7u", "_blank");
            });
        }
    </script>
</body>
</html>
