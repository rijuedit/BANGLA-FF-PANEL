<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Panel Premium - BANGLA FF PANEL</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Theme */
        body { background-color: #05020a; color: #ffffff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; min-height: 100vh; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05020a; }
        ::-webkit-scrollbar-thumb { background: #9d00ff; border-radius: 4px; }

        /* Navbar Header */
        .navbar-custom { background: #0c0514; border-bottom: 1px solid #2a113d; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .logo-img { width: 38px; height: 38px; border-radius: 8px; border: 1px solid #9d00ff; object-fit: cover; }
        
        .btn-back { background: rgba(157, 0, 255, 0.15); border: 1px solid #9d00ff; color: white; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { background: #9d00ff; color: white; }
        .btn-discord { background: #ff0066; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        .btn-discord:hover { background: #cc0052; color: white; }

        /* Page Container */
        .container-custom { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .page-title { text-align: center; color: #ffffff; font-size: 24px; font-weight: 800; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }

        /* Product Card Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: #11071a; border: 1px solid #2a113d; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { border-color: #9d00ff; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(157, 0, 255, 0.25); }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; border: 1px solid #9d00ff; margin-bottom: 15px; background: #05020a; }
        .product-title { color: #ffffff; font-size: 16px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        
        .btn-buy { background: #9d00ff; color: white; border: none; font-weight: bold; padding: 10px; border-radius: 8px; width: 100%; font-size: 14px; transition: 0.3s; }
        .btn-buy:hover { background: #ff0066; }

        /* Modal Purchase UI */
        .modal-content { background-color: #11071a; border: 1px solid #ff0066; border-radius: 16px; color: white; box-shadow: 0 0 25px rgba(255, 0, 102, 0.3); }
        .modal-header { border-bottom: 1px solid #2a113d; padding: 15px 20px; }
        .modal-title { color: #ff0066; font-size: 18px; font-weight: 800; width: 100%; text-align: center; text-transform: uppercase; }
        
        .pkg-option { background: #0c0514; border: 1px solid #2a113d; border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .pkg-option:hover, .pkg-option.selected { border-color: #00cc66; background: rgba(0, 204, 102, 0.08); }
        .pkg-duration { color: #ffffff; font-weight: bold; font-size: 14px; }
        .pkg-price { color: #00cc66; font-weight: 800; font-size: 15px; }
        
        .user-id-input { background: #05020a; border: 1px solid #2a113d; color: white; border-radius: 8px; padding: 10px; font-size: 13px; width: 100%; margin-top: 15px; }
        .user-id-input:focus { border-color: #9d00ff; outline: none; }

        .btn-order-ticket { background: #00cc66; color: #000000; border: none; font-weight: 800; padding: 12px; border-radius: 8px; width: 100%; font-size: 15px; margin-top: 15px; transition: 0.3s; }
        .btn-order-ticket:hover { background: #00ff80; transform: scale(1.02); }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        
        <div class="d-flex align-items-center gap-2">
            <img src="logo.png" alt="Logo" class="logo-img">
            <span style="font-weight: 800; color: #ffffff; font-size: 16px;">BANGLA FF PANEL</span>
        </div>

        <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="btn-discord dynamic-discord">
            <i class="fa-fab fa-discord me-1"></i> Discord
        </a>
    </div>

    <!-- Main Container -->
    <div class="container-custom">
        <h2 class="page-title"><i class="fa-solid fa-desktop text-danger me-2"></i> PC PANEL PREMIUM</h2>
        
        <div id="productGrid" class="product-grid">
            <!-- Loading products via JavaScript -->
        </div>
    </div>

    <!-- Purchase Modal -->
    <div class="modal fade" id="buyModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProductName">PRODUCT NAME</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body">
                    <div id="modalPackagesList">
                        <!-- Package Options Loaded Here -->
                    </div>

                    <div>
                        <input type="text" id="discordUserIdInput" class="user-id-input" placeholder="আপনার Discord Username অথবা ID দিন (Optional)">
                    </div>

                    <button type="button" id="btnSubmitTicket" class="btn-order-ticket" onclick="submitOrder()">
                        NEXT: ORDER TICKET
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const buyModal = new bootstrap.Modal(document.getElementById('buyModal'));

        let selectedProduct = null;
        let selectedPkg = null;

        // 🌟 স্মার্ট প্রাইস ডিটেক্টর (মেলাবে newPrice, price, salePrice, oldPrice)
        function getPackagePrice(pkg) {
            if (!pkg) return 0;
            if (pkg.newPrice !== undefined && pkg.newPrice !== null && pkg.newPrice !== '') return pkg.newPrice;
            if (pkg.price !== undefined && pkg.price !== null && pkg.price !== '') return pkg.price;
            if (pkg.salePrice !== undefined && pkg.salePrice !== null && pkg.salePrice !== '') return pkg.salePrice;
            if (pkg.oldPrice !== undefined && pkg.oldPrice !== null && pkg.oldPrice !== '') return pkg.oldPrice;
            if (pkg.resellPrice !== undefined && pkg.resellPrice !== null && pkg.resellPrice !== '') return pkg.resellPrice;
            return 0;
        }

        // 1. Database থেকে প্রোডাক্ট আনা
        function loadPCPanels() {
            database.ref('pc_panels').on('value', (snapshot) => {
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';
                
                snapshot.forEach((child) => {
                    const id = child.key;
                    const product = child.val();
                    
                    const pName = product.name || product.title || 'PC Panel';
                    const pImg = product.imageUrl || product.image || 'logo.png';
                    
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <img src="${pImg}" class="product-img" alt="${pName}" onerror="this.src='logo.png'">
                            <div class="product-title">${pName}</div>
                        </div>
                        <button class="btn-buy" onclick="openBuyModal('${id}')">
                            <i class="fa-solid fa-cart-shopping me-1"></i> BUY NOW
                        </button>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        let allProducts = {};
        database.ref('pc_panels').on('value', snap => { allProducts = snap.val() || {}; });

        // 2. মোডাল ওপেন করা ও প্যাকেজ সিলেক্ট করা
        function openBuyModal(id) {
            selectedProduct = allProducts[id];
            if (!selectedProduct) return;

            const pName = selectedProduct.name || selectedProduct.title || 'PC Panel';
            document.getElementById('modalProductName').innerText = pName;

            const pkgListDiv = document.getElementById('modalPackagesList');
            pkgListDiv.innerHTML = '';

            const pkgs = Array.isArray(selectedProduct.packages) 
                ? selectedProduct.packages 
                : (selectedProduct.packages ? Object.values(selectedProduct.packages) : []);

            selectedPkg = null;

            if (pkgs.length > 0) {
                pkgs.forEach((pkg, index) => {
                    const priceVal = getPackagePrice(pkg);
                    const durationStr = pkg.duration || pkg.name || 'Package';

                    const pkgElem = document.createElement('div');
                    pkgElem.className = `pkg-option ${index === 0 ? 'selected' : ''}`;
                    pkgElem.onclick = () => selectPackage(pkgElem, pkg);

                    pkgElem.innerHTML = `
                        <div class="pkg-duration"><i class="fa-regular fa-clock text-warning me-1"></i> ${durationStr}</div>
                        <div class="pkg-price">৳${priceVal} BDT</div>
                    `;
                    pkgListDiv.appendChild(pkgElem);

                    if (index === 0) selectedPkg = pkg; // Default first package
                });
            } else {
                pkgListDiv.innerHTML = `<div class="text-center text-danger">No package found!</div>`;
            }

            buyModal.show();
        }

        function selectPackage(elem, pkg) {
            document.querySelectorAll('.pkg-option').forEach(el => el.classList.remove('selected'));
            elem.classList.add('selected');
            selectedPkg = pkg;
        }

        // 3. ডাইরেক্ট বট এপিআই তে টিকেট রিকোয়েস্ট পাঠানো
        function submitOrder() {
            if (!selectedPkg) {
                alert("দয়া করে একটি প্যাকেজ সিলেক্ট করুন!");
                return;
            }

            const btn = document.getElementById('btnSubmitTicket');
            btn.disabled = true;
            btn.innerText = "CREATING TICKET...";

            const discordUser = document.getElementById('discordUserIdInput').value.trim();
            const productTitle = selectedProduct.name || selectedProduct.title || "PC Panel";
            const packageName = selectedPkg.duration || "N/A";
            const price = getPackagePrice(selectedPkg);

            fetch("https://bangla-ff-bot-server.onrender.com/create-ticket", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    discordUserId: discordUser,
                    packageName: packageName,
                    price: price,
                    productTitle: productTitle
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.url) {
                    window.location.href = data.url; // টিকেট লিংকে রিডাইরেক্ট হবে
                } else {
                    alert("টিকেট তৈরি করা সম্ভব হয়নি। আবার চেষ্টা করুন!");
                    btn.disabled = false;
                    btn.innerText = "NEXT: ORDER TICKET";
                }
            })
            .catch(err => {
                console.error(err);
                alert("সার্ভারে সমস্যা হয়েছে! অনুগ্রহ করে আবার চেষ্টা করুন।");
                btn.disabled = false;
                btn.innerText = "NEXT: ORDER TICKET";
            });
        }

        window.onload = loadPCPanels;
    </script>
</body>
</html>
