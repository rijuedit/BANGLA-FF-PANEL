<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Panel Store - BANGLA FF PANEL</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0512;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header / Navbar */
        .navbar {
            background: #140924;
            border-bottom: 2px solid #2a113d;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
        }

        .brand-text h1 {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: #a855f7;
            font-weight: 600;
            display: block;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: #1a0b2e;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #2a113d;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: #a855f7;
            background: #251042;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .nav-btn.discord {
            background: #5865F2;
            border-color: #5865F2;
        }

        .nav-btn.discord:hover {
            background: #4752C4;
            border-color: #4752C4;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.4);
        }

        /* Container & Back Link */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            background: #140924;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #2a113d;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #1a0b2e;
            color: #00f2fe;
            border-color: #00f2fe;
            transform: translateX(-3px);
        }

        /* Setup Video Section */
        .video-section {
            background: #140924;
            border: 1px solid #2a113d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .video-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #00f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #0a0512;
            border: 1px solid #2a113d;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Section Title */
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #a855f7;
            padding-left: 12px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #140924;
            border: 1px solid #2a113d;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a0b2e;
            border-bottom: 1px solid #2a113d;
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .product-pricing {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 16px;
        }

        .old-price {
            font-size: 0.9rem;
            color: #888;
            text-decoration: line-through;
        }

        .sale-price {
            font-size: 1.3rem;
            font-weight: 800;
            color: #00f2fe;
        }

        .btn-buy {
            margin-top: auto;
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            background: linear-gradient(135deg, #b866ff, #7e22ce);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        /* Loading & Empty state */
        .loading-spinner {
            text-align: center;
            padding: 40px;
            grid-column: 1 / -1;
            color: #a855f7;
            font-size: 1.2rem;
        }

        /* Purchase Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 18, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .modal-card {
            background: #140924;
            border: 1px solid #2a113d;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a113d;
            padding-bottom: 12px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 700;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ff4d4d;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: #1a0b2e;
            border: 1px solid #2a113d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #a855f7;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0512;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>BANGLA FF PANEL</h1>
                <span>PREMIUM CORP</span>
            </div>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            <a href="https://discord.gg/ZBjSWaF7u" target="_blank" class="nav-btn discord"><i class="fab fa-discord"></i> Discord</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Back Link Above Video Box -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>

        <!-- Setup Video Section -->
        <div class="video-section" id="videoContainer" style="display: none;">
            <h2><i class="fas fa-play-circle"></i> Setup Video Tutorial</h2>
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Section Title -->
        <h2 class="section-title"><i class="fas fa-desktop"></i> PC Panel Products</h2>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading Products...</div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="purchaseModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modalProductName">Buy PC Panel</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="purchaseForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="selectedProductId">
                <div class="form-group">
                    <label for="packageSelect">Select Package / Duration</label>
                    <select id="packageSelect" class="form-control" required onchange="updateModalPrice()">
                        <!-- Dynamic Packages -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Total Price (৳)</label>
                    <input type="text" id="modalPrice" class="form-control" readonly style="color: #00f2fe; font-weight: bold;">
                </div>
                <div class="form-group">
                    <label for="userUid">Your Game UID / Discord Name</label>
                    <input type="text" id="userUid" class="form-control" placeholder="Enter UID or Discord Tag" required>
                </div>
                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod" class="form-control" required>
                        <option value="bKash Personal (01869942698)">bKash Personal (01869942698)</option>
                        <option value="Nagad Personal (01624528622)">Nagad Personal (01624528622)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="trxId">Transaction ID (TrxID)</label>
                    <input type="text" id="trxId" class="form-control" placeholder="Enter Payment TrxID" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Confirm Order</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentProductsData = {};

        // Fetch Setup Video
        database.ref('settings/video_pc').on('value', snapshot => {
            const videoUrl = snapshot.val();
            const videoContainer = document.getElementById('videoContainer');
            const videoIframe = document.getElementById('videoIframe');

            if (videoUrl && videoUrl.trim() !== "") {
                let embedUrl = videoUrl;
                if (videoUrl.includes('youtube.com/watch?v=')) {
                    embedUrl = videoUrl.replace('watch?v=', 'embed/');
                } else if (videoUrl.includes('youtu.be/')) {
                    embedUrl = videoUrl.replace('youtu.be/', 'youtube.com/embed/');
                } else if (videoUrl.includes('drive.google.com') && videoUrl.includes('/view')) {
                    embedUrl = videoUrl.replace('/view', '/preview');
                }
                videoIframe.src = embedUrl;
                videoContainer.style.display = 'block';
            } else {
                videoContainer.style.display = 'none';
            }
        });

        // Fetch PC Products from correct node 'pc_panels'
        database.ref('pc_panels').on('value', snapshot => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            currentProductsData = snapshot.val() || {};

            if (!snapshot.exists() || Object.keys(currentProductsData).length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No PC Panels Available At The Moment.</p>';
                return;
            }

            Object.keys(currentProductsData).forEach(key => {
                const item = currentProductsData[key];
                const oldPrice = item.oldPrice ? `৳${item.oldPrice}` : '';
                const salePrice = item.salePrice ? `৳${item.salePrice}` : (item.price ? `৳${item.price}` : 'N/A');

                const cardHTML = `
                    <div class="product-card">
                        <img src="${item.image || 'https://via.placeholder.com/300x180?text=PC+Panel'}" class="product-img" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                        <div class="product-info">
                            <h3 class="product-title">${item.name || 'PC Panel'}</h3>
                            <div class="product-pricing">
                                ${oldPrice ? `<span class="old-price">${oldPrice}</span>` : ''}
                                <span class="sale-price">${salePrice}</span>
                            </div>
                            <button class="btn-buy" onclick="openModal('${key}')">
                                <i class="fas fa-shopping-cart"></i> Buy Now
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        });

        // Modal Functionalities
        function openModal(productId) {
            const product = currentProductsData[productId];
            if (!product) return;

            document.getElementById('selectedProductId').value = productId;
            document.getElementById('modalProductName').innerText = product.name;
            
            const pkgSelect = document.getElementById('packageSelect');
            pkgSelect.innerHTML = '';

            // Handle package pricing if available, else default to product price
            if (product.packages && typeof product.packages === 'object' && Object.keys(product.packages).length > 0) {
                Object.keys(product.packages).forEach(pkgName => {
                    const option = document.createElement('option');
                    option.value = product.packages[pkgName];
                    option.textContent = `${pkgName} - ৳${product.packages[pkgName]}`;
                    pkgSelect.appendChild(option);
                });
            } else {
                const option = document.createElement('option');
                option.value = product.salePrice || product.price || 0;
                option.textContent = `Standard License - ৳${product.salePrice || product.price || 0}`;
                pkgSelect.appendChild(option);
            }

            updateModalPrice();
            document.getElementById('purchaseModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('purchaseModal').style.display = 'none';
        }

        function updateModalPrice() {
            const pkgSelect = document.getElementById('packageSelect');
            document.getElementById('modalPrice').value = `৳${pkgSelect.value}`;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing Order...';

            const productId = document.getElementById('selectedProductId').value;
            const product = currentProductsData[productId];
            const pkgSelect = document.getElementById('packageSelect');
            const selectedPackageText = pkgSelect.options[pkgSelect.selectedIndex].text;
            const uid = document.getElementById('userUid').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const trxId = document.getElementById('trxId').value;

            const orderPayload = {
                type: 'PC Panel',
                productName: product.name,
                package: selectedPackageText,
                price: document.getElementById('modalPrice').value,
                userUid: uid,
                paymentMethod: paymentMethod,
                trxId: trxId,
                timestamp: new Date().toISOString()
            };

            try {
                // Send order payload to render bot server
                await fetch('https://bangla-ff-bot-server.onrender.com/send-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                alert('Order Submitted Successfully! Please check Discord for processing.');
                closeModal();
            } catch (err) {
                console.error('Error submitting order:', err);
                alert('Order request placed! Connection warning: Discord notification may take a moment.');
                closeModal();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Confirm Order';
            }
        }
    </script>
</body>
</html>
