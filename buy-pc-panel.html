
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla FF Panel - PC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --neon-green: #00ff7f;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        #mouse-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at var(--x, 50%) var(--y, 50%),
                rgba(168,85,247,.13) 0%,
                transparent 48%
            );
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            background: rgba(13,8,24,.94);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-purple);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            border: 1px solid var(--neon-purple);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: .3s;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .video-container {
            max-width: 800px;
            margin: 22px auto;
            border: 1.5px solid var(--neon-purple);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(168,85,247,.2);
            position: relative;
            z-index: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
            gap: 22px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .product-card {
            background: #0f0a1d;
            border: 1.5px solid #1f1a2e;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            transition: .3s;
            min-width: 0;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        .product-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 13px;
            margin-bottom: 15px;
            border: 1px solid #2d2640;
            background: #08040d;
        }

        .btn-buy {
            background: linear-gradient(90deg,#d400ff,#ff007f);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255,0,127,.25);
            transition: .3s;
        }

        .btn-buy:hover {
            box-shadow: 0 0 20px var(--neon-pink);
            transform: scale(1.015);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.88);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-y: auto;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 480px;
            border: 1.5px solid var(--neon-pink);
            border-radius: 20px;
            position: relative;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255,0,127,.2);
            margin: auto;
        }

        .modal-title {
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 22px;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .package-item {
            background: #07030b;
            border: 1px solid #2d2640;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: .2s;
        }

        .package-item:hover {
            border-color: var(--neon-green);
        }

        .package-item.selected {
            border: 2px solid var(--neon-green);
            background: rgba(0,255,127,.06);
        }

        .package-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .package-info i {
            color: #facc15;
            flex-shrink: 0;
        }

        .package-price {
            color: var(--neon-green);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            white-space: nowrap;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin: 20px 0 8px;
        }

        .discord-input {
            width: 100%;
            background: #07030b;
            border: 1px solid var(--neon-pink);
            color: white;
            padding: 14px 15px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .discord-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0,255,127,.12);
        }

        .discord-input::placeholder { color: #777; }

        .id-help-text {
            font-size: 13px;
            line-height: 1.7;
            color: #aaa;
            margin-top: 10px;
        }

        .btn-ticket {
            background: linear-gradient(90deg,#00c96b,#00ff91);
            color: #000;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            transition: .3s;
            margin-top: 18px;
        }

        .btn-ticket:hover {
            box-shadow: 0 0 22px rgba(0,255,127,.35);
        }

        .btn-ticket:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn-back-packages {
            background: #21142d;
            color: white;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            transition: .2s;
        }

        .btn-back-packages:hover { background: #352047; }

        .close-modal {
            position: absolute;
            top: 13px;
            right: 18px;
            color: #999;
            font-size: 26px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-modal:hover { color: white; }

        .notice {
            display: none;
            padding: 11px;
            margin-top: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .notice.show { display: block; }

        .notice.error {
            color: #fecaca;
            background: #2a0c13;
            border: 1px solid #7f1d1d;
        }

        .notice.info {
            color: #ddd6fe;
            background: #1b1030;
            border: 1px solid #6d28d9;
        }

        .loading-text {
            text-align: center;
            padding: 35px 10px;
            color: #aaa;
        }

        .hidden { display: none !important; }

        @media(max-width:600px) {
            .navbar { padding: 11px 10px; }
            .navbar .orbitron { font-size: 10px; text-align: center; }
            .nav-btn { padding: 6px 8px; font-size: 10px; }
            .product-grid {
                grid-template-columns: repeat(2,minmax(0,1fr));
                gap: 12px;
                padding: 12px;
            }
            .product-card { padding: 10px; border-radius: 13px; }
            .product-image { height: 115px; }
            .product-card h3 { font-size: 11px; }
            .btn-buy { padding: 10px 4px; font-size: 10px; }
            .modal { padding: 12px; }
            .modal-content { padding: 22px 16px; }
            .modal-title { font-size: 15px; padding: 0 18px; }
            .package-item { padding: 12px 10px; }
            .package-info { font-size: 13px; }
            .package-price { font-size: 11px; }
        }
    </style>
</head>

<body>
    <div id="mouse-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-btn">
            <i class="fas fa-chevron-left mr-1"></i> BACK
        </a>

        <div class="orbitron text-white text-lg font-bold tracking-widest">
            BANGLA FF PANEL
        </div>

        <a
            id="discordBtn"
            href="https://discord.gg/ZBjSWaF7u"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-btn"
        >
            <i class="fab fa-discord mr-1"></i> DISCORD
        </a>
    </nav>

    <!-- Setup Video -->
    <section id="videoSection" class="video-container hidden">
        <div id="videoFrame"></div>
    </section>

    <header class="text-center mt-10 px-3 relative z-10">
        <h1 class="orbitron text-2xl md:text-3xl font-bold flex items-center justify-center gap-3">
            <i class="fas fa-desktop" style="color:#ff007f"></i>
            PC PANEL PREMIUM
        </h1>
        <p class="text-gray-400 mt-3">Choose your package and place your order</p>
    </header>

    <div id="productGrid" class="product-grid">
        <div class="loading-text">Loading PC Panels...</div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalProductTitle">
        <div class="modal-content">
            <button type="button" id="closeModalBtn" class="close-modal" aria-label="Close">&times;</button>

            <div id="modalProductTitle" class="modal-title">SELECT PACKAGE</div>

            <div id="packageList"></div>

            <div id="customerSection" class="hidden">
                <label for="discordUser" class="field-label">
                    <i class="fab fa-discord"></i>
                    আপনার Discord Username অথবা ID লিখুন
                </label>

                <input
                    type="text"
                    id="discordUser"
                    class="discord-input"
                    placeholder="যেমন: your_username অথবা Discord ID"
                    autocomplete="off"
                    maxlength="100"
                >

                <p class="id-help-text">
                    Username, Display Name অথবা Discord ID দিতে পারবেন।
                    অর্ডার করার আগে আমাদের Discord Server-এ Join করা থাকতে হবে।
                </p>

                <div id="orderNotice" class="notice" role="alert" aria-live="polite"></div>

                <button type="button" id="createTicketBtn" class="btn-ticket">
                    <i class="fab fa-discord mr-2"></i>
                    CREATE PRIVATE TICKET
                </button>
            </div>

            <button type="button" id="continueBtn" class="btn-ticket">
                CONTINUE
            </button>

            <button type="button" id="backPackagesBtn" class="btn-back-packages hidden">
                <i class="fas fa-arrow-left mr-1"></i> BACK TO PACKAGES
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            get
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ================= FIREBASE CONFIG =================

        const firebaseConfig = {
            databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Your existing bot API
        const BOT_API_URL =
            "https://bangla-ff-bot-server.onrender.com/create-ticket";

        let currentProduct = null;
        let currentProductId = null;
        let packages = [];
        let selectedPkgIndex = null;
        let submitting = false;

        const $ = (id) => document.getElementById(id);

        // ================= MOUSE GLOW =================

        document.addEventListener("mousemove", (event) => {
            const glow = $("mouse-glow");
            glow.style.setProperty("--x", event.clientX + "px");
            glow.style.setProperty("--y", event.clientY + "px");
        });

        // ================= STATUS =================

        function showNotice(message, type = "error") {
            const notice = $("orderNotice");
            notice.textContent = message;
            notice.className = `notice show ${type}`;
        }

        function clearNotice() {
            $("orderNotice").textContent = "";
            $("orderNotice").className = "notice";
        }

        // ================= SETUP VIDEO =================

        function getVideoEmbedUrl(rawUrl) {
            try {
                const url = new URL(rawUrl);

                if (url.hostname === "youtu.be") {
                    const videoId = url.pathname.slice(1);
                    return videoId
                        ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}`
                        : null;
                }

                if (
                    url.hostname === "youtube.com" ||
                    url.hostname === "www.youtube.com" ||
                    url.hostname === "m.youtube.com"
                ) {
                    if (url.pathname === "/watch") {
                        const id = url.searchParams.get("v");
                        return id
                            ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`
                            : null;
                    }

                    const match = url.pathname.match(/^\/(embed|shorts)\/([^/]+)/);

                    if (match) {
                        return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(match[2])}`;
                    }
                }

                if (url.hostname === "drive.google.com") {
                    const match = url.pathname.match(/\/file\/d\/([^/]+)/);

                    if (match) {
                        return `https://drive.google.com/file/d/${encodeURIComponent(match[1])}/preview`;
                    }

                    if (url.pathname.includes("/preview")) {
                        return url.href;
                    }
                }

                return null;
            } catch {
                return null;
            }
        }

        onValue(
            ref(db, "settings/video_pc"),
            (snapshot) => {
                const container = $("videoSection");
                const frame = $("videoFrame");
                const url = snapshot.val();

                frame.replaceChildren();

                if (!url || typeof url !== "string") {
                    container.classList.add("hidden");
                    return;
                }

                const embedUrl = getVideoEmbedUrl(url.trim());

                if (!embedUrl) {
                    container.classList.add("hidden");
                    return;
                }

                const iframe = document.createElement("iframe");
                iframe.src = embedUrl;
                iframe.className = "w-full aspect-video";
                iframe.title = "PC Panel Setup Video";
                iframe.loading = "lazy";
                iframe.allowFullscreen = true;
                iframe.referrerPolicy = "strict-origin-when-cross-origin";

                frame.appendChild(iframe);
                container.classList.remove("hidden");
            },
            (error) => {
                console.error("Video load error:", error);
            }
        );

        // ================= DISCORD LINK =================

        onValue(
            ref(db, "global_settings/discord_link"),
            (snapshot) => {
                const link = snapshot.val();

                if (typeof link === "string" && /^https:\/\/\S+/i.test(link)) {
                    $("discordBtn").href = link;
                }
            },
            (error) => {
                console.error("Discord link load error:", error);
            }
        );

        // ================= LOAD PRODUCTS =================

        onValue(
            ref(db, "pc_panels"),
            (snapshot) => {
                const grid = $("productGrid");
                grid.replaceChildren();

                if (!snapshot.exists()) {
                    const empty = document.createElement("div");
                    empty.className = "loading-text";
                    empty.textContent = "No PC Panel products available right now.";
                    grid.appendChild(empty);
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const product = childSnapshot.val() || {};

                    const card = document.createElement("article");
                    card.className = "product-card";

                    const image = document.createElement("img");
                    image.className = "product-image";
                    image.alt = product.title || "PC Panel";
                    image.loading = "lazy";
                    image.src = product.image || "https://placehold.co/400x200/0d0818/ffffff?text=PC+Panel";
                    image.onerror = () => {
                        image.onerror = null;
                        image.src = "https://placehold.co/400x200/0d0818/ffffff?text=No+Image";
                    };

                    const title = document.createElement("h3");
                    title.className = "orbitron text-md font-bold mb-4";
                    title.textContent = product.title || "PC Panel";

                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "btn-buy";

                    const icon = document.createElement("i");
                    icon.className = "fas fa-shopping-cart mr-2";
                    button.append(icon, document.createTextNode("Buy Now"));

                    button.addEventListener("click", () => {
                        openPurchaseModal(id);
                    });

                    card.append(image, title, button);
                    grid.appendChild(card);
                });
            },
            (error) => {
                console.error("Products load error:", error);
                $("productGrid").textContent =
                    "Products could not be loaded. Please try again later.";
            }
        );

        // ================= OPEN PURCHASE MODAL =================

        async function openPurchaseModal(id) {
            try {
                const snapshot = await get(ref(db, `pc_panels/${id}`));

                if (!snapshot.exists()) {
                    alert("This product is no longer available.");
                    return;
                }

                currentProductId = id;
                currentProduct = snapshot.val() || {};

                const rawPackages = currentProduct.packages;

                packages = Array.isArray(rawPackages)
                    ? rawPackages
                    : Object.values(rawPackages || {});

                packages = packages.filter((pkg) => pkg && typeof pkg === "object");

                selectedPkgIndex = null;

                $("modalProductTitle").textContent =
                    currentProduct.title || "PC Panel";

                $("packageList").replaceChildren();
                $("customerSection").classList.add("hidden");
                $("continueBtn").classList.remove("hidden");
                $("backPackagesBtn").classList.add("hidden");
                $("discordUser").value = "";
                $("createTicketBtn").disabled = false;
                $("createTicketBtn").innerHTML =
                    '<i class="fab fa-discord mr-2"></i> CREATE PRIVATE TICKET';

                clearNotice();

                if (packages.length === 0) {
                    $("packageList").textContent =
                        "No packages are currently available for this product.";
                    $("continueBtn").classList.add("hidden");
                } else {
                    packages.forEach((pkg, index) => {
                        const item = document.createElement("button");
                        item.type = "button";
                        item.className = "package-item";
                        item.style.width = "100%";
                        item.setAttribute("aria-pressed", "false");

                        const info = document.createElement("span");
                        info.className = "package-info";

                        const clock = document.createElement("i");
                        clock.className = "far fa-clock";

                        const duration = document.createElement("span");
                        duration.textContent = pkg.duration || "Package";

                        info.append(clock, duration);

                        const price = document.createElement("span");
                        price.className = "package-price";
                        price.textContent = `৳${pkg.sell_price ?? "0"} BDT`;

                        item.append(info, price);

                        item.addEventListener("click", () => {
                            selectPackage(index);
                        });

                        $("packageList").appendChild(item);
                    });
                }

                $("purchaseModal").style.display = "flex";
            } catch (error) {
                console.error("Open product error:", error);
                alert("Could not load product details. Please try again.");
            }
        }

        // ================= SELECT PACKAGE =================

        function selectPackage(index) {
            selectedPkgIndex = index;

            document.querySelectorAll(".package-item").forEach((item, i) => {
                const selected = i === index;
                item.classList.toggle("selected", selected);
                item.setAttribute("aria-pressed", String(selected));
            });
        }

        // ================= CONTINUE TO CUSTOMER DETAILS =================

        $("continueBtn").addEventListener("click", () => {
            if (selectedPkgIndex === null) {
                alert("দয়া করে একটি প্যাকেজ সিলেক্ট করুন!");
                return;
            }

            $("customerSection").classList.remove("hidden");
            $("continueBtn").classList.add("hidden");
            $("backPackagesBtn").classList.remove("hidden");

            clearNotice();
            $("discordUser").focus();
        });

        $("backPackagesBtn").addEventListener("click", () => {
            if (submitting) return;

            $("customerSection").classList.add("hidden");
            $("continueBtn").classList.remove("hidden");
            $("backPackagesBtn").classList.add("hidden");

            clearNotice();
        });

        // ================= CREATE TICKET =================

        $("createTicketBtn").addEventListener("click", submitOrder);

        async function submitOrder() {
            if (submitting) return;

            const customerInput = $("discordUser").value.trim();

            if (selectedPkgIndex === null || !packages[selectedPkgIndex]) {
                showNotice("দয়া করে একটি প্যাকেজ সিলেক্ট করুন।");
                return;
            }

            if (!customerInput) {
                showNotice("আপনার Discord Username অথবা ID লিখুন।");
                $("discordUser").focus();
                return;
            }

            if (customerInput.length > 100) {
                showNotice("Username বা ID সর্বোচ্চ ১০০ অক্ষরের হতে পারবে।");
                return;
            }

            if (!currentProduct || !currentProduct.title) {
                showNotice("Product details পাওয়া যায়নি। আবার চেষ্টা করুন।");
                return;
            }

            const pkg = packages[selectedPkgIndex];
            const button = $("createTicketBtn");

            const payload = {
                // Server accepts a username/display name or a numeric Discord ID.
                discordUserId: customerInput,
                discordUsername: customerInput,
                productTitle: String(currentProduct.title),
                packageName: String(pkg.duration || "N/A"),
                price: Number(pkg.sell_price),
                category: "BUY PC PANEL"
            };

            if (!Number.isFinite(payload.price) || payload.price < 0) {
                showNotice("এই প্যাকেজের মূল্য সঠিক নয়। Admin-এর সঙ্গে যোগাযোগ করুন।");
                return;
            }

            submitting = true;
            button.disabled = true;
            button.textContent = "CREATING TICKET...";
            clearNotice();

            try {
                const response = await fetch(BOT_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                let result;

                try {
                    result = await response.json();
                } catch {
                    throw new Error(
                        "BOT_RESPONSE_INVALID"
                    );
                }

                if (!response.ok || !result.success) {
                    if (result.error === "MEMBER_NOT_FOUND") {
                        showNotice(
                            "আপনার Member পাওয়া যায়নি। Username সঠিকভাবে লিখুন এবং আমাদের Discord Server-এ Join করা আছে কি না দেখুন।"
                        );
                    } else if (result.error === "USERNAME_NOT_UNIQUE") {
                        showNotice(
                            "একই নামের একাধিক Member পাওয়া গেছে। দয়া করে আপনার Numeric Discord User ID ব্যবহার করুন।"
                        );
                    } else if (result.error === "BOT_NOT_READY") {
                        showNotice(
                            "Bot এখন চালু হচ্ছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
                        );
                    } else if (result.error === "MISSING_ORDER_DETAILS") {
                        showNotice(
                            "Order details অসম্পূর্ণ। পেজ Reload করে আবার চেষ্টা করুন।"
                        );
                    } else {
                        showNotice(
                            "Ticket তৈরি হয়নি। Discord Server-এ Join করা আছে কি না দেখুন, তারপর আবার চেষ্টা করুন।"
                        );
                    }

                    return;
                }

                if (
                    typeof result.url !== "string" ||
                    !/^https:\/\/discord\.com\/channels\/\d+\/\d+/.test(result.url)
                ) {
                    showNotice(
                        "Ticket তৈরি হয়েছে, কিন্তু সঠিক Ticket Link পাওয়া যায়নি। Admin-এর সঙ্গে যোগাযোগ করুন।"
                    );
                    return;
                }

                showNotice("Ticket তৈরি হয়েছে! Discord Ticket খুলছে...", "info");

                window.location.assign(result.url);

            } catch (error) {
                console.error("Create ticket request failed:", error);

                if (error.message === "BOT_RESPONSE_INVALID") {
                    showNotice(
                        "Bot Server সঠিক Response দেয়নি। Bot চালু আছে কি না পরীক্ষা করুন।"
                    );
                } else {
                    showNotice(
                        "Bot Server-এর সঙ্গে সংযোগ হয়নি। Render Server চালু আছে কি না পরীক্ষা করুন।"
                    );
                }
            } finally {
                submitting = false;
                button.disabled = false;
                button.innerHTML =
                    '<i class="fab fa-discord mr-2"></i> CREATE PRIVATE TICKET';
            }
        }

        // ================= CLOSE MODAL =================

        function closeModal() {
            if (submitting) return;
            $("purchaseModal").style.display = "none";
            clearNotice();
        }

        $("closeModalBtn").addEventListener("click", closeModal);

        $("purchaseModal").addEventListener("click", (event) => {
            if (event.target === $("purchaseModal")) {
                closeModal();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (
                event.key === "Escape" &&
                $("purchaseModal").style.display === "flex"
            ) {
                closeModal();
            }
        });

    </script>
</body>
</html>
