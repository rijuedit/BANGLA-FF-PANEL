<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla FF Panel - PC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-dark: #07030b;
            --card-bg: #0d0818;
            --neon-pink: #ff007f;
            --neon-purple: #a855f7;
            --neon-green: #00ff7f;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Mouse Glow Effect */
        #mouse-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(168, 85, 247, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navbar */
        .navbar {
            background: rgba(13, 8, 24, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-purple);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            border: 1px solid var(--neon-purple);
            padding: 6px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Video Container */
        .video-container {
            max-width: 800px;
            margin: 20px auto;
            border: 1.5px solid var(--neon-purple);
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        /* Product Card */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: #0f0a1d;
            border: 1.5px solid #1f1a2e;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .product-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .product-image {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #2d2640;
        }

        .btn-buy {
            background: linear-gradient(90deg, #d400ff, #ff007f);
            color: white;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.3s;
        }

        .btn-buy:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* Modal Design (Exactly like Screenshot) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f0a19;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--neon-pink);
            border-radius: 15px;
            position: relative;
            padding: 25px;
        }

        .modal-title {
            color: var(--neon-pink);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .package-item {
            background: #07030b;
            border: 1px solid #2d2640;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .package-item:hover {
            border-color: var(--neon-green);
        }

        .package-item.selected {
            border-color: var(--neon-green);
            background: rgba(0, 255, 127, 0.05);
        }

        .package-info { display: flex; align-items: center; gap: 10px; }
        .package-info i { color: #facc15; font-size: 14px; }
        .package-price { color: var(--neon-green); font-weight: bold; }

        .discord-input {
            width: 100%;
            background: #07030b;
            border: 1px solid #2d2640;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            outline: none;
            font-size: 14px;
        }

        .discord-input:focus { border-color: var(--neon-pink); }

        .btn-ticket {
            background: #00ff7f;
            color: #000;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-ticket:hover { background: #00d66b; box-shadow: 0 0 20px rgba(0, 255, 127, 0.4); }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: #666; font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-btn"><i class="fas fa-chevron-left mr-2"></i>Back</a>
        <div class="orbitron text-white text-lg font-bold tracking-widest">BANGLA FF PANEL</div>
        <a href="https://discord.gg/ZBjSWaF7u" class="nav-btn"><i class="fab fa-discord mr-2"></i>Discord</a>
    </nav>

    <!-- Setup Video -->
    <div id="videoSection" class="video-container hidden">
        <div id="videoFrame"></div>
    </div>

    <div class="text-center mt-10">
        <h1 class="orbitron text-2xl font-bold flex items-center justify-center gap-3">
            <i class="fas fa-desktop text-neon-pink"></i> PC PANEL PREMIUM
        </h1>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- Products will load here -->
    </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalProductTitle" class="modal-title">PRODUCT NAME</div>
            
            <div id="packageList">
                <!-- Packages dynamic -->
            </div>

            <input type="text" id="discordUser" class="discord-input" placeholder="আপনার Discord Username অথবা ID দিন">

            <button onclick="submitOrder()" class="btn-ticket">NEXT: ORDER TICKET</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://bangla-ff-admin-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let selectedPackage = null;
        let currentProduct = null;

        // Mouse Move Effect
        document.addEventListener('mousemove', e => {
            const glow = document.getElementById('mouse-glow');
            glow.style.setProperty('--x', e.clientX + 'px');
            glow.style.setProperty('--y', e.clientY + 'px');
        });

        // Load Video
        onValue(ref(db, 'settings/video_pc'), (snapshot) => {
            const container = document.getElementById('videoSection');
            const frame = document.getElementById('videoFrame');
            const url = snapshot.val();
            if(url) {
                container.classList.remove('hidden');
                let embedUrl = url;
                if(url.includes('youtube.com/watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
                else if(url.includes('drive.google.com')) embedUrl = url.replace('/view', '/preview');
                frame.innerHTML = `<iframe src="${embedUrl}" class="w-full aspect-video" frameborder="0" allowfullscreen></iframe>`;
            }
        });

        // Load Products
        onValue(ref(db, 'pc_panels'), (snapshot) => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(id => {
                    const p = data[id];
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${p.image}" class="product-image" onerror="this.src='https://placehold.co/400x200?text=No+Image'">
                        <h3 class="orbitron text-md font-bold mb-4">${p.title}</h3>
                        <button onclick="openPurchaseModal('${id}')" class="btn-buy"><i class="fas fa-shopping-cart mr-2"></i> Buy Now</button>
                    `;
                    grid.appendChild(card);
                });
            }
        });

        window.openPurchaseModal = function(id) {
            onValue(ref(db, `pc_panels/${id}`), (snapshot) => {
                const p = snapshot.val();
                currentProduct = p;
                selectedPackage = null;
                document.getElementById('modalProductTitle').innerText = p.title;
                const pkgList = document.getElementById('packageList');
                pkgList.innerHTML = '';

                if(p.packages) {
                    p.packages.forEach((pkg, index) => {
                        const item = document.createElement('div');
                        item.className = 'package-item';
                        item.onclick = () => selectPackage(index, item);
                        item.innerHTML = `
                            <div class="package-info"><i class="far fa-clock"></i> <span>${pkg.duration}</span></div>
                            <div class="package-price">৳${pkg.sell_price} BDT</div>
                        `;
                        pkgList.appendChild(item);
                    });
                }
                document.getElementById('purchaseModal').style.display = 'flex';
            }, {onlyOnce: true});
        };

        window.selectPackage = function(index, element) {
            document.querySelectorAll('.package-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedPackage = currentProduct.packages[index];
        };

        window.closeModal = function() {
            document.getElementById('purchaseModal').style.display = 'none';
        };

        window.submitOrder = function() {
            const discord = document.getElementById('discordUser').value.trim();
            if(!selectedPackage) return alert("দয়া করে একটি প্যাকেজ সিলেক্ট করুন।");
            if(!discord) return alert("দয়া করে আপনার ডিসকর্ড নাম অথবা আইডি দিন।");

            const msg = `🛒 *NEW ORDER REQUEST*\n\n` +
                        `👤 Customer: ${discord}\n` +
                        `📦 Product: ${currentProduct.title}\n` +
                        `⏳ Duration: ${selectedPackage.duration}\n` +
                        `💰 Price: ৳${selectedPackage.sell_price}`;

            const url = `https://bangla-ff-bot-server.onrender.com/create-ticket?username=${encodeURIComponent(discord)}&details=${encodeURIComponent(msg)}`;
            window.location.href = url;
        };
    </script>
</body>
</html>
